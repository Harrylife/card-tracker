name: Sync card data
on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Past prices to load: 0 = none, 90 = three months, all = everything back to Feb 2024"
        default: "0"
permissions:
  contents: write
  actions: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Install 7zip
        run: |
          sudo apt-get update -y || true
          sudo apt-get install -y p7zip-full || echo "7zip not installed (only needed for backfill)"
      - name: Download prices
        id: sync
        env:
          BACKFILL_DAYS: ${{ github.event.inputs.backfill_days }}
        run: python3 sync.py
      - name: Save results
        run: |
          git config user.name "card-tracker-bot"
          git config user.email "bot@users.noreply.github.com"
          git config http.postBuffer 524288000
          git add -A data
          if git diff --cached --quiet; then echo "Nothing new to save"; exit 0; fi
          git commit -m "Daily price sync"
          for i in 1 2 3; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            sleep 5
          done
          echo "::error::Could not save the results to GitHub (push failed 3 times)"
          exit 1
      - name: Keep loading history
        if: steps.sync.outputs.more == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          BF: ${{ github.event.inputs.backfill_days }}
        run: |
          echo "More history to load: starting another run"
          gh workflow run "Sync card data" --ref "$GITHUB_REF_NAME" -f backfill_days="$BF" || echo "Could not start the next run: run Sync card data again to continue"
