name: Sync card data
on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Days of past prices to load (0 = none, try 90)"
        default: "0"
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install 7zip
        run: sudo apt-get update -y && sudo apt-get install -y p7zip-full
      - name: Download prices
        env:
          BACKFILL_DAYS: ${{ github.event.inputs.backfill_days }}
        run: python3 sync.py
      - name: Save results
        run: |
          git config user.name "card-tracker-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet || (git commit -m "Daily price sync" && git push)
