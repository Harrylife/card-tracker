<html lang="en"><head><meta charset="utf-8">

.bt{width:100%;padding:13px;border:0;border-radius:12px;background:var(--ac);color:var(--on);font:inherit;font-weight:700;cursor:pointer}

body[data-lay="grid"] .list .rt{display:flex;justify-content:space-between;align-items:center;text-align:left}

else if("del"in d)sheet('<h2>Delete “'+E(P().name)+'”?</h2><p class="mu">Its cards are removed from your totals.</p><button class="bt" data-dy>Delete portfolio</button><button class="bt g" data-x>Keep it</button>');

else if("th"in d){CF.theme=d.th;applyCF();render()}

/* Account + cloud sync (Firebase) */
const CFG=window.FB_CONFIG,OK=!!(CFG&&CFG.apiKey&&!/PASTE/.test(CFG.apiKey));
let FA=null,FD=null,FU=null,AM="in",AE="",AX="",AOK=0,ST="",unsub=null,pt=null;
const AER={"auth/invalid-credential":"Wrong email or password.","auth/invalid-email":"That email doesn’t look right.","auth/email-already-in-use":"That email already has an account.","auth/weak-password":"Password needs at least 6 characters.","auth/too-many-requests":"Too many tries. Wait a minute and try again.","auth/network-request-failed":"No connection. Check your internet."};
const pay=()=>JSON.stringify({ps:S.ps,a:S.a,sort:S.sort});
const ld=u=>new Promise((r,j)=>{const s=document.createElement("script");s.src=u;s.onload=r;s.onerror=j;document.head.append(s)});
const redo=()=>{if(S.tab=="a")render()};
function push(){if(!FU||!FD)return;clearTimeout(pt);pt=setTimeout(()=>{FD.doc("users/"+FU.uid).set({data:pay(),updated:Date.now()},{merge:true}).then(()=>{ST="Synced "+new Date().toLocaleTimeString();redo()}).catch(e=>{ST="Sync error: "+e.code;redo()})},800)}
function listen(){let first=true;unsub=FD.doc("users/"+FU.uid).onSnapshot(s=>{if(s.metadata.hasPendingWrites)return;const d=s.exists?s.data().data:null;
if(d&&d!==pay()){try{const c=JSON.parse(d);if(first)try{localStorage.setItem("ct1_backup",JSON.stringify(S))}catch(e){}S.ps=c.ps;S.a=c.a;S.sort=c.sort;try{localStorage.setItem("ct1",JSON.stringify(S))}catch(e){}render()}catch(e){}}
else if(!d&&first)push();
first=false;ST="Synced "+new Date().toLocaleTimeString();redo()},e=>{ST="Sync error: "+e.code;redo()})}
async function fbInit(){if("serviceWorker"in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{});
if(!OK)return;try{const b="https://www.gstatic.com/firebasejs/10.12.2/firebase-";await ld(b+"app-compat.js");await Promise.all([ld(b+"auth-compat.js"),ld(b+"firestore-compat.js")]);firebase.initializeApp(CFG);FA=firebase.auth();FD=firebase.firestore();
FA.onAuthStateChanged(u=>{FU=u;if(!AUTHR){AUTHR=1;setTimeout(()=>{u?discord():welcome()},600)}if(unsub){unsub();unsub=null}if(u)listen();else ST="";redo()})}catch(e){AE="Couldn’t reach the sync service. Check your connection.";redo()}}
async function authGo(){const g=i=>$("#"+i)?$("#"+i).value.trim():"";const em=g("ae"),us=g("au"),pw=$("#ap").value;AE="";AOK=0;AX=em;
if(!FA){AE="Sync is still loading. Try again in a moment.";return render()}
try{if(AM=="up"){if(!/^[A-Za-z0-9_]{3,20}$/.test(us))throw{message:"Username must be 3 to 20 letters, numbers or underscores."};
const c=await FA.createUserWithEmailAndPassword(em,pw);
try{await FD.doc("usernames/"+us.toLowerCase()).set({uid:c.user.uid})}catch(e){await c.user.delete();throw{message:"That username is taken. Pick another."}}
await c.user.updateProfile({displayName:us});await FD.doc("users/"+c.user.uid).set({username:us,email:em},{merge:true})}
else await FA.signInWithEmailAndPassword(em,pw)}catch(e){AE=AER[e.code]||e.message||"Something went wrong."}
render()}
function resetPw(){const em=$("#ae").value.trim();AX=em;AOK=0;if(!em){AE="Enter your email first.";return render()}
FA.sendPasswordResetEmail(em).then(()=>{AE="Reset link sent. Check your email.";AOK=1}).catch(e=>{AE=AER[e.code]||"Couldn’t send the reset email."}).finally(render)}
function signOut(){FA.signOut().then(()=>{S={ps:[{id:1,name:"My Collection",items:{}}],a:1,tab:"a"};try{localStorage.setItem("ct1",JSON.stringify(S))}catch(e){}render()})}
function vA(){
if(!OK)return '<h1>Account</h1><p class="mu">Cloud sync isn’t switched on in this copy yet. Follow Part 2 and Part 3 of the tutorial to turn it on.</p>';
if(FU)return '<h1>Account</h1><div class="card cp"><b>'+E(FU.displayName||"Signed in")+'</b><span class="mu">'+E(FU.email)+'</span><p class="mu">'+E(ST||"Syncing…")+'</p></div><p class="mu">Your portfolios sync to every device signed in to this account. Signing out removes this device’s local copy; your cards stay in your account.</p><button class="bt g" data-out>Sign out</button>';
const up=AM=="up";
return "<h1>"+(up?"Create account":"Sign in")+"</h1>"+(AE?'<p style="color:'+(AOK?"var(--up)":"#e5484d")+'">'+E(AE)+"</p>":"")+'<input id="ae" type="email" placeholder="Email" autocomplete="email" value="'+E(AX)+'">'+(up?'<input id="au" placeholder="Username" autocomplete="username" autocapitalize="none">':"")+'<input id="ap" type="password" placeholder="Password" autocomplete="'+(up?"new":"current")+'-password"><button class="bt" data-go>'+(up?"Create account":"Sign in")+"</button>"+(up?"":'<button class="lk" data-fp>Forgot password?</button><br>')+'<button class="lk" data-au>'+(up?"Have an account? Sign in":"New here? Create an account")+"</button>"}
document.addEventListener("keydown",e=>{if(e.key=="Enter"&&e.target.id=="ap")authGo()});
/* Settings, themes, layout */
let CF={theme:"default",lm:"list",ld:"list"};try{Object.assign(CF,JSON.parse(localStorage.getItem("ct1c")||"{}"))}catch(e){}
const THEMES=["default","dark","light","green","blue","orange","yellow"];
function applyCF(){try{localStorage.setItem("ct1c",JSON.stringify(CF))}catch(e){}const r=document.documentElement;if(CF.theme=="default")delete r.dataset.theme;else r.dataset.theme=CF.theme;document.body.dataset.lay=matchMedia("(min-width:900px)").matches?CF.ld:CF.lm}

const ly=(k,l)=>'<div class="mu" style="margin-top:10px">'+l+'</div><div class="chips">'+[["list","List"],["grid","Grid"]].map(([v,n])=>'<button class="chip '+(CF[k]==v?"on":"")+'" data-ly="'+k+":"+v+'">'+n+"</button>").join("")+"</div>";
return "<h1>Settings</h1>"+'<div class="card cp"><b>Theme</b><div class="chips" style="margin-top:8px;flex-wrap:wrap">'+th+"</div></div>"+'<div class="card cp"><b>Card layout when browsing</b>'+ly("lm","Phone and small screens")+ly("ld","Desktop and large screens")+"</div>"+'<div class="card cp"><b>Community</b><button class="bt g" data-dc>Join our Discord</button></div>'+'<div class="card cp" style="padding-top:4px">'+vA().replace(/<h1>/g,"<h2>").replace(/<\/h1>/g,"</h2>")+"</div>"}
/* Popups */

/* Camera scan (beta): reads text from the camera picture and matches it to the card data */
let STREAM=null,SCT=null,SCBUSY=0,TSW=null,SCP=null,SCM=[];
function scanParse(t){const T=(t||"").replace(/[|]/g,"I");
const nums=[...T.matchAll(/\b0*(\d{1,3})\s*\/\s*0*(\d{1,3})\b/g)].map(m=>m[1]+"/"+m[2]);
const grd=T.match(/\b(PSA|CGC|BGS|SGC|TAG|ACE|BECKETT)\b[\s\S]{0,40}?\b(10|9\.5|9|8\.5|8|7\.5|7|6|5|4|3|2|1)\b/i);
const words=[...new Set(T.toLowerCase().match(/[a-z][a-z'’.\-]{2,}/g)||[])];
const lat=(T.match(/[A-Za-z]/g)||[]).length/(T.replace(/\s/g,"").length||1);
return{nums,grd,words,lat}}
async function scanMatch(p){const nk=n=>String(n||"").split("/").map(x=>/^\d+$/.test(x)?String(+x):x).join("/");
const sc=r=>{const nm=r[2].toLowerCase();let s=0;p.words.forEach(w=>{if(nm.includes(w))s+=w.length>3?2:1});return s};
const run=(rows,jp)=>{const o=[];for(const r of rows){const nn=p.nums.includes(nk(r[3])),s=sc(r);if((nn&&s>=1)||(!p.nums.length&&s>=4)||(nn&&p.words.length<2))o.push([s+(nn?3:0),r])}
o.sort((a,b)=>b[0]-a[0]);return o.slice(0,4).map(([s,r])=>({...cd([r[0],r[2],r[3],r[4],r[5],r[6],r[7]],(jp?"j":"")+r[1]),jp,sc:s}))};
let out=[];if(p.lat>=.5)out=run(await loadIdx(),0);
if(!out.length||out[0].sc<3){try{const j=run(await loadJIdx(),1);if(j.length&&(!out.length||j[0].sc>out[0].sc))out=j}catch(e){}}
return out}
function scanRender(){const o=$("#scr");if(!o)return;const p=SCP||{},g=p.grd?'<p class="mu">Graded slab detected: '+E(p.grd[1].toUpperCase()+" "+p.grd[2])+". Tap a result, then choose Graded.</p>":"";
o.innerHTML=SCM.length?"<b>Found</b>"+(SCM[0].jp?'<p class="mu">Language not recognised as English, so these are Japanese matches.</p>':"")+g+'<div class="list">'+SCM.map(c=>row(c,rt(c))).join("")+"</div>":'<p class="mu">Looking for a card, graded slab or sealed product. Hold it steady, fill the frame and keep the card number at the bottom in view.</p>'+g}
async function scanTick(){if(SCBUSY||!STREAM||!TSW)return;const v=$("#scv");if(!v||!v.videoWidth)return;SCBUSY=1;
try{const k=Math.min(1,1100/v.videoWidth),cv=document.createElement("canvas");cv.width=v.videoWidth*k;cv.height=v.videoHeight*k;cv.getContext("2d").drawImage(v,0,0,cv.width,cv.height);
const r=await TSW.recognize(cv);SCP=scanParse(r.data.text);SCM=await scanMatch(SCP);scanRender()}catch(e){}SCBUSY=0}
async function scanOpen(){if(!LIVE){sheet('<h2>Scanner</h2><p class="mu">The scanner needs live data. Open the hosted app.</p><button class="bt g" data-x>Close</button>');return}
const o=$("#scn");o.hidden=false;o.innerHTML='<video id="scv" autoplay playsinline muted></video><div id="scr" class="scp"><p class="mu">Starting camera…</p></div><button class="bt g scx" data-sx>Close</button>';SCM=[];SCP=null;
try{STREAM=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280}}});$("#scv").srcObject=STREAM}catch(e){$("#scr").innerHTML='<p>Camera blocked. Allow camera access for this site, then try again.</p>';return}
$("#scr").innerHTML='<p class="mu">Loading the scanner (the first time takes a moment)…</p>';
try{if(!window.Tesseract)await ld("https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js");if(!TSW)TSW=await Tesseract.createWorker("eng")}catch(e){$("#scr").innerHTML='<p>Couldn’t load the scanner. Check your connection.</p>';return}
scanRender();SCT=setInterval(scanTick,1800)}
function scanClose(){clearInterval(SCT);if(STREAM)STREAM.getTracks().forEach(t=>t.stop());STREAM=null;const o=$("#scn");o.hidden=true;o.innerHTML=""}
document.addEventListener("pointermove",hov);document.addEventListener("pointerdown",hov);document.addEventListener("pointerout",hovOut);
if(window.matchMedia)matchMedia("(min-width:900px)").addEventListener("change",applyCF);
applyCF();render();init();fbInit();if(!OK)setTimeout(()=>discord(),900);
