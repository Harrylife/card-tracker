ть её.","La sincronización en la nube aún no está activada en esta copia. Sigue las partes 2 y 3 del tutorial para activarla.","סנכרון הענן עדיין לא הופעל בעותק הזה. עקבו אחרי חלקים 2 ו-3 במדריך כדי להפעיל אותו."],"Enter your email first.":["Saisissez d’abord votre e-mail.","请先输入邮箱。","먼저 이메일을 입력하세요.","先にメールアドレスを入力してください。","Сначала введите эл. почту.","Primero escribe tu correo.","הזינו קודם את האימייל."],"The two passwords don’t match. Retype them.":["Les deux mots de passe ne correspondent pas. Retapez-les.","两次输入的密码不一致，请重新输入。","두 비밀번호가 일치하지 않습니다. 다시 입력하세요.","2つのパスワードが一致しません。もう一度入力してください。","Пароли не совпадают. Введите их заново.","Las dos contraseñas no coinciden. Vuelve a escribirlas.","שתי הסיסמאות אינן תואמות. הקלידו אותן שוב."],"Wrong email or password.":["E-mail ou mot de passe incorrect.","邮箱或密码错误。","이메일 또는 비밀번호가 올바르지 않습니다.","メールアドレスまたはパスワードが違います。","Неверная эл. почта или пароль.","Correo o contraseña incorrectos.","אימייל או סיסמה שגויים."],"That email doesn’t look right.":["Cet e-mail ne semble pas valide.","这个邮箱格式不正确。","올바른 이메일이 아닌 것 같습니다.","メールアドレスの形式が正しくありません。","Похоже, эл. почта указана неверно.","Ese correo no parece válido.","נראה שהאימייל אינו תקין."],"That email already has an account.":["Cet e-mail a déjà un compte.","这个邮箱已注册账号。","이 이메일로 이미 계정이 있습니다.","このメールアドレスはすでに登録されています。","Для этой эл. почты уже есть аккаунт.","Ese correo ya tiene una cuenta.","לאימייל הזה כבר יש חשבון."],"That username is taken. Pick another.":["Ce nom d’utilisateur est pris. Choisissez-en un autre.","这个用户名已被占用，请换一个。","이미 사용 중인 사용자 이름입니다. 다른 이름을 선택하세요.","そのユーザー名は使われています。別の名前を選んでください。","Это имя пользователя занято. Выберите другое.","Ese nombre de usuario ya existe. Elige otro.","שם המשתמש תפוס. בחרו אחר."],"Password needs at least 6 characters.":["Le mot de passe doit contenir au moins 6 caractères.","密码至少需要 6 个字符。","비밀번호는 6자 이상이어야 합니다.","パスワードは6文字以上にしてください。","Пароль должен содержать не менее 6 символов.","La contraseña debe tener al menos 6 caracteres.","הסיסמה חייבת להכיל לפחות 6 תווים."],"Username must be 3 to 20 letters, numbers or underscores.":["Le nom d’utilisateur doit contenir 3 à 20 lettres, chiffres ou tirets bas.","用户名须为 3 到 20 个字母、数字或下划线。","사용자 이름은 3~20자의 영문, 숫자 또는 밑줄이어야 합니다.","ユーザー名は3〜20文字の英数字またはアンダースコアにしてください。","Имя пользователя: от 3 до 20 букв, цифр или знаков подчёркивания.","El nombre de usuario debe tener de 3 a 20 letras, números o guiones bajos.","שם המשתמש חייב להכיל 3 עד 20 אותיות, ספרות או קווים תחתונים."],"Too many tries. Wait a minute and try again.":["Trop de tentatives. Patientez une minute puis réessayez.","尝试次数过多，请等一分钟再试。","시도 횟수가 너무 많습니다. 1분 후 다시 시도하세요.","試行回数が多すぎます。1分ほど待ってからもう一度お試しください。","Слишком много попыток. Подождите минуту и повторите.","Demasiados intentos. Espera un minuto e inténtalo de nuevo.","יותר מדי ניסיונות. המתינו דקה ונסו שוב."],"Couldn’t send the reset email.":["Impossible d’envoyer l’e-mail de réinitialisation.","无法发送重置邮件。","재설정 이메일을 보내지 못했습니다.","リセットメールを送信できませんでした。","Не удалось отправить письмо для сброса.","No se pudo enviar el correo de restablecimiento.","לא ניתן היה לשלוח את אימייל האיפוס."],"Reset link sent. Check your email.":["Lien de réinitialisation envoyé. Vérifiez votre e-mail.","重置链接已发送，请查收邮件。","재설정 링크를 보냈습니다. 이메일을 확인하세요.","リセット用リンクを送信しました。メールをご確認ください。","Ссылка для сброса отправлена. Проверьте почту.","Enlace de restablecimiento enviado. Revisa tu correo.","קישור האיפוס נשלח. בדקו את האימייל."],"No connection. Check your internet.":["Pas de connexion. Vérifiez votre internet.","没有网络连接，请检查网络。","연결되지 않았습니다. 인터넷을 확인하세요.","接続できません。インターネット接続を確認してください。","Нет соединения. Проверьте интернет.","Sin conexión. Revisa tu internet.","אין חיבור. בדקו את האינטרנט."],"Sync is still loading. Try again in a moment.":["La synchronisation se charge encore. Réessayez dans un instant.","同步仍在加载，请稍后再试。","동기화를 아직 불러오는 중입니다. 잠시 후 다시 시도하세요.","同期はまだ読み込み中です。しばらくしてからもう一度お試しください。","Синхронизация ещё загружается. Повторите через минуту.","La sincronización aún se está cargando. Inténtalo en un momento."," isted with no cards yet.":["Les cartes dans cette langue n’ont pas de prix publiés. Les prix précédés de ≈ sont des estimations tirées de la carte japonaise correspondante ; ces cartes se vendent généralement moins cher. Les sets sans données propres utilisent l’édition japonaise du même set, et ceux sans équivalent japonais sont listés sans cartes pour l’instant.","此语言的卡牌没有公开价格。带 ≈ 的价格是根据对应日文卡牌估算的，通常实际售价更低。没有自身卡牌数据的系列会使用同一系列的日文版，找不到日文对应的系列则暂时不显示卡牌。","이 언어의 카드에는 공개된 가격이 없습니다. ≈ 표시 가격은 해당하는 일본어 카드로 추정한 값이며, 보통 더 저렴하게 팔립니다. 자체 카드 데이터가 없는 세트는 같은 세트의 일본어판을 사용하고, 일본어 대응 세트가 없는 세트는 아직 카드 없이 표시됩니다.","この言語のカードには公開価格がありません。≈ 付きの価格は対応する日本語版カードからの推定値で、通常はより安く売られています。独自のカードデータがないセットは同じセットの日本語版を使い、日本語版にも対応がないセットはカードなしで表示されます。","У карт на этом языке нет опубликованных цен. Цены со знаком ≈ — оценки по соответствующей японской карте; такие карты обычно продаются дешевле. Наборы без собственных данных используют японскую версию того же набора, а наборы без японского аналога показаны без карт.","Las cartas en este idioma no tienen precios publicados. Los precios con ≈ son estimaciones de la carta japonesa equivalente y suelen venderse por menos. Las colecciones sin datos propios usan la edición japonesa de la misma colección, y las que no tienen equivalente japonés aparecen sin cartas por ahora.","לקלפים בשפה הזו אין מחירים מפורסמים. מחירים עם ≈ הם הערכות לפי הקלף היפני התואם, ובדרך כלל הם נמכרים בפחות. סטים ללא נתוני קלפים משלהם משתמשים בגרסה היפנית של אותו סט, וסטים ללא התאמה יפנית מופיעים בלי קלפים בינתיים."],"Loading sets…":["Chargement des sets…","正在加载系列…","세트 불러오는 중…","セットを読み込み中…","Загрузка наборов…","Cargando colecciones…","טוען סטים…"],"Loading Japanese sets…":["Chargement des sets japonais…","正在加载日文系列…","일본어 세트 불러오는 중…","日本語版セットを読み込み中…","Загрузка японских наборов…","Cargando colecciones japonesas…","טוען סטים יפניים…"],"Loading…":["Chargement…","加载中…","불러오는 중…","読み込み中…","Загрузка…","Cargando…","טוען…"],"Loading cards…":["Chargement des cartes…","正在加载卡牌…","카드 불러오는 중…","カードを読 te de cartes n’est disponible pour ce set pour le moment.","此系列暂时没有可用的卡牌列表。","이 세트의 카드 목록은 아직 제공되지 않습니다.","このセットのカードリストはまだ利用できません。","Список карт для этого набора пока недоступен.","Todavía no hay una lista de cartas disponible para esta colección.","רשימת קלפים לסט הזה אינה זמינה עדיין."],"There is no card data for this set, so the cards, pictures and sealed products are from the Japanese release of the same set (the printed card can be numbered or look a little different). These cards have no published prices. Prices marked ≈ are estimates from the Japanese card, and they usually sell for less.":["Il n’y a pas de données de cartes pour ce set : les cartes, images et produits scellés proviennent de l’édition japonaise du même set (la carte imprimée peut être numérotée ou présentée un peu différemment). Ces cartes n’ont pas de prix publiés. Les prix marqués ≈ sont estimés d’après la carte japonaise ; ces cartes se vendent généralement moins cher.","此系列没有卡牌数据，因此卡牌、图片和密封产品来自同一系列的日文版（实际印刷的卡牌编号或外观可能略有不同）。这些卡牌没有公开价格，带 ≈ 的价格是根据日文卡牌估算的，通常实际售价更低。","이 세트에는 카드 데이터가 없어 카드, 이미지, 미개봉 제품은 같은 세트의 일본어판을 사용합니다(실제 인쇄된 카드는 번호나 모양이 조금 다를 수 있습니다). 이 카드에는 공개된 가격이 없습니다. ≈ 표시 가격은 일본어 카드로 추정한 값이며 보통 더 저렴하게 팔립니다.","このセットにはカードデータがないため、カード・画像・未開封商品は同じセットの日本語版のものです（実際に印刷されたカードは番号や見た目が少し異なる場合があります）。これらのカードには公開価格がありません。≈ 付きの価格は日本語版カードからの推定値で、通常はより安く売られています。","Для этого набора нет данных о картах, поэтому карты, изображения и запечатанные товары взяты из японской версии того же набора (напечатанная карта может иметь другой номер или вид). У этих карт нет опубликованных цен. Цены со знаком ≈ — оценки по японской карте; они обычно продаются дешевле.","No hay datos de cartas para esta colección, así que las cartas, imágenes y productos sellados provienen de la edición japonesa de la misma colección (la carta impresa puede tener otra numeración o aspecto). Estas cartas no tienen precios publicados. Los precios con ≈ son estimaciones de la carta japonesa y suelen venderse por menos.","אין נתוני קלפים לסט הזה, ולכן הקלפים, התמונות והמוצרים האטומים לקוחים מהמהדורה היפנית של אותו סט (הקלף המודפס עשוי להיות ממוספר או להיראות מעט אחרת). לקלפים האלה אין מחירים מפורסמים. מחירים עם ≈ הם הערכות לפי הקלף היפני, ובדרך כלל הם נמכרים בפחות."],"These cards have no published prices. Prices marked ≈ are estimates from the matching Japanese card (they usually sell for less), and the sealed products listed are the Japanese equivalents.":["Ces cartes n’ont pas de prix publiés. Les prix marqués ≈ sont estimés d’après la carte japonaise correspondante (ils sont généralement plus bas), et les produits scellés listés sont les équivalents japonais.","这些卡牌没有公开价格。带 ≈ 的价格是根据对应日文卡牌估算的（通常实际售价更低），所列密封产品为日文版对应产品。","이 카드에는 공개된 가격이 없습니다. ≈ 표시 가격은 해당하는 일본어 카드로 추정한 값이며(보통 더 저렴함), 표시된 미개봉 제품은 일본어판 제품입니다.","これらのカードには公開価格がありません。≈ 付きの価格は対応する日本語版カードからの推定値（通常はより安価）で、表示されている未開封商品は日本語版のものです。","У этих карт нет опубликованных цен. Цены со знаком ≈ — оценки по соответствующей японской карте (обычно они ниже), а перечисленные запечатанные товары — японские аналоги.","Estas cartas no tienen precios publicados. Los precios con ≈ son estimaciones de la carta japonesa equivalente (suelen ser menores) y los productos sellados son los equivalentes japoneses.","לקלפים האלה אין מחירים מפורסמים. מחירים עם ≈ הם הערכות לפי הקלף היפני התואם (בדרך כלל נמוכים יותר), והמוצרים האטומים הרשומים הם המקבילים היפניים."],"No Japanese match was found for this set, so there are no price estimates.":["Aucune correspondance japonaise n’a été trouvée pour ce set, il n’y a donc pas d’estimation de prix.","没有找到此系列的日文对应，因此没有价格估算。","이 세트와 일치하는 일본어 세트를 찾지 못해 가격 추정치가 없습니다.","このセットに対応する日本語版が見つからなかったため、価格の推定はありません。","Японского аналога для этого набора не найдено, поэтому оценок цен нет.","No se encontró equivalente japonés para esta colección, así que no hay precios estimados.","לא נמצאה התאמה יפנית לסט הזה, ולכן אין הערכות מחיר."],"No sealed products are in the data for this set yet.":["Aucun produit scellé dans les données de ce set pour le moment.","此系列的数据中暂无密封产品。","이 세트의 데이터에는 아직 미개봉 제품이 없습니다.","このセットのデータには未開封商品がまだありません。","В данных этого набора пока нет запечатанных товаров.","Aún no hay productos sellados en los datos de esta colección.","אין עדיין מוצרים אטומים בנתוני הסט הזה."],"Nothing to show.":["Rien à afficher.","没有可显示的内容。","표시할 항목이 없습니다.","表示するものがありません。","Нечего показывать.","No hay nada que mostrar.","אין מה להציג."],"There are no cards or products for this set yet. New sets can take a few days to appear.":["Il n’y a pas encore de cartes ni de produits pour ce set. Les nouveaux sets peuvent mettre quelques jours à apparaître.","此系列暂时没有卡牌或产品。新系列可能需要几天才会出现。","이 세트에는 아직 카드나 제품이 없습니다. 새 세트는 나타나기까지 며칠 걸릴 수 있습니다.","このセットにはまだカードや商品がありません。新しいセットは反映まで数日かかることがあります。","Для этого набора пока нет карт и товаров. Новые наборы могут появиться через несколько дней.","Aún no hay cartas ni productos de esta colección. Las nuevas colecciones pueden tardar unos días en aparecer.","עדיין אין קלפים או מוצרים לסט הזה. סטים חדשים עשויים להופיע רק אחרי כמה ימים."],"This set’s card list isn’t in the offline sample. It loads when the page is hosted online.":["La liste des cartes de ce set n’est pas dans l’échantillon hors ligne. Elle se charge quand la page est hébergée en ligne.","此系列的卡牌列表不在离线示例中，页面在线托管后才会加载。","이 세트의 카드 목록은 오프라인 샘플에 없습니다. 페이지를 온라인에 호스팅하면 불러옵니다.","このセットのカードリストはオフラインのサンプルに含まれていません。ページをオンラインで公開すると読み込まれます。","Списка карт этого набора нет в офлайн-примере. Он загрузится, когда страница будет размещена онлайн.","La lista de cartas de esta colección no está en la muestra sin conexión. Se carga cuando la página está alojada en línea.","רשימת הקלפים של הסט הזה אינה בדוגמה הלא מקוונת. היא נטענת כשהדף מתארח באינטרנט."],"Total card count loads with live data":["Le nombre total de cartes se charge avec les données en direct","卡牌总数将随实时数据加载","전체 카드 수는 실시간 데이터와 함께 불러옵니다","カードの総数はライブデータと一緒に読み込まれます","Общее число карт загрузится вместе с живыми данными","El total de cartas se carga con los datos en vivo","מספר הקלפים הכול orique des prix…","正在加载价格历史…","가격 기록 불러오는 중…","価格履歴を読み込み中…","Загрузка истории цен…","Cargando el historial de precios…","טוען היסטוריית מחירים…"],"Not enough history in this range yet.":["Pas encore assez d’historique sur cette période.","此时间范围内的历史数据还不够。","이 기간에는 아직 기록이 충분하지 않습니다.","この期間の履歴はまだ十分ではありません。","В этом диапазоне пока недостаточно истории.","Aún no hay suficiente historial en este rango.","אין עדיין מספיק היסטוריה בטווח הזה."],"Price history needs live prices. It works once the app is hosted online.":["L’historique des prix nécessite les prix en direct. Il fonctionne dès que l’application est hébergée en ligne.","价格历史需要实时价格，应用在线托管后即可使用。","가격 기록에는 실시간 가격이 필요합니다. 앱이 온라인에 호스팅되면 작동합니다.","価格履歴にはライブ価格が必要です。アプリをオンラインで公開すると使えます。","Для истории цен нужны живые цены. Она заработает, когда приложение будет размещено онлайн.","El historial de precios necesita precios en vivo. Funciona cuando la app está alojada en línea.","היסטוריית מחירים דורשת מחירים חיים. היא עובדת כשהאפליקציה מתארחת באינטרנט."],"A new price is saved once a day.":["Un nouveau prix est enregistré une fois par jour.","价格每天保存一次。","새 가격은 하루에 한 번 저장됩니다.","新しい価格は1日1回保存されます。","Новая цена сохраняется раз в день.","Se guarda un precio nuevo una vez al día.","מחיר חדש נשמר פעם ביום."],"The graph moves as you add cards and prices change.":["Le graphique évolue quand vous ajoutez des cartes et que les prix changent.","随着你添加卡牌和价格变化，图表会随之变动。","카드를 추가하거나 가격이 바뀌면 그래프가 움직입니다.","カードを追加したり価格が変わるとグラフが動きます。","График меняется при добавлении карт и изменении цен.","El gráfico cambia al añadir cartas y al cambiar los precios.","הגרף משתנה כשמוסיפים קלפים והמחירים משתנים."],"The card feed took too long to answer.":["Le flux de cartes a mis trop de temps à répondre.","卡牌数据源响应超时。","카드 피드가 응답하는 데 너무 오래 걸렸습니다.","カードフィードの応答に時間がかかりすぎました。","Источник данных о картах слишком долго отвечал.","El servicio de cartas tardó demasiado en responder.","מקור נתוני הקלפים לקח יותר מדי זמן להגיב."],"Couldn’t reach the card feed. Check your conn עם Google"],"That email already has an account that uses a different sign-in method. Sign in that way first.":["Cette adresse e-mail a déjà un compte qui utilise une autre méthode de connexion. Connectez-vous d’abord de cette façon.","该邮箱已有使用其他登录方式的账号。请先用那种方式登录。","이 이메일은 이미 다른 로그인 방식을 사용하는 계정이 있습니다. 먼저 그 방식으로 로그인하세요.","そのメールアドレスには、別のログイン方法のアカウントがすでにあります。先にその方法でログインしてください。","У этого адреса уже есть аккаунт с другим способом входа. Сначала войдите тем способом.","Ese correo ya tiene una cuenta con otro método de inicio de sesión. Inicia sesión primero de esa forma.","לכתובת האימייל הזו כבר יש חשבון שמשתמש בשיטת כניסה אחרת. היכנסו קודם בשיטה הזו."],"Your browser blocked the sign-in window. Allow pop-ups and try again.":["Votre navigateur a bloqué la fenêtre de connexion. Autorisez les fenêtres contextuelles et réessayez.","浏览器拦截了登录窗口。请允许弹出窗口后重试。","브라우저가 로그인 창을 차단했습니다. 팝업을 허용한 뒤 다시 시도하세요.","ブラウザがログインウィンドウをブロックしました。ポップアップを許可してもう一度お試しください。","Браузер заблокировал окно входа. Разрешите всплывающие окна и повторите попытку.","Tu navegador bloqueó la ventana de inicio de sesión. Permite las ventanas emergentes e inténtalo de nuevo.","הדפדפן חסם את חלון הכניסה. אפשרו חלונות קופצים ונסו שוב."],"That sign-in method isn’t switched on yet.":["Cette méthode de connexion n’est pas encore activée.","该登录方式尚未开启。","이 로그인 방식은 아직 켜져 있지 않습니다.","このログイン方法はまだ有効になっていません。","Этот способ входа ещё не включён.","Ese método de inicio de sesión aún no está activado.","שיטת הכניסה הזו עדיין לא מופעלת."],"This website isn’t on the allowed list for sign-in yet.":["Ce site n’est pas encore dans la liste autorisée pour la connexion.","此网站尚未加入允许登录的名单。","이 웹사이트는 아직 로그인 허용 목록에 없습니다.","このウェブサイトはまだログイン許可リストに入っていません。","Этого сайта пока нет в списке разрешённых для входа.","Este sitio web aún no está en la lista permitida para iniciar sesión.","האתר הזה עדיין לא ברשימת האתרים המותרים לכניסה."],"Sign-in windows aren’t supported here. Try another browser.":["Les fenêtres de connexion ne sont pas prises en charge ici. Essayez un autre navigateur.","此处不支持登录窗口。请换一个浏览器试试。","여기서는 로그인 창을 지원하지 않습니다. 다른 브라우저를 사용해 보세요.","ここではログインウィンドウに対応していません。別のブラウザをお試しください。","Окна входа здесь не поддерживаются. Попробуйте другой браузер.","Las ventanas de inicio de sesión no son compatibles aquí. Prueba con otro navegador.","חלונות כניסה אינם נתמכים כאן. נסו דפדפן אחר."],"Search this set by name, number or rarity":["Rechercher dans ce set par nom, numéro ou rareté","按名称、编号或稀有度搜索此系列","이름, 번호 또는 희귀도로 이 세트 검색","名前・番号・レア度でこのセットを検索","Поиск в этом наборе по названию, номеру или редкости","Buscar en esta colección por nombre, número o rareza","חפשו בסט הזה לפי שם, מספר או נדירות"],"Nothing in this set matches your search.":["Rien dans ce set ne correspond à votre recherche.","此系列中没有符合搜索条件的内容。","이 세트에서 검색과 일치하는 항목이 없습니다.","このセットに検索条件に合うものはありません。","В этом наборе ничего не найдено.","Nada en esta colección coincide con tu búsqueda.","שום דבר בסט הזה לא תואם לחיפוש."],"No matches in this view. Try the All filter to include cards and sealed products.":["Aucun résultat dans cette vue. Essayez le filtre « Tout » pour inclure les cartes et les produits scellés.","此视图中没有匹配项。请尝试“全部”筛选，以包含卡牌和密封产品。","이 보기에는 일치하는 항목이 없습니다. 카드와 미개봉 제품을 모두 보려면 ‘전체’ 필터를 사용해 보세요.","この表示には一致するものがありません。カードと未開封商品の両方を含めるには「すべて」フィルターをお試しください。","В этом списке ничего нет. Попробуйте фильтр «Все», чтобы включить карты и запечатанные товары.","Sin resultados en esta vista. Prueba el filtro «Todo» para incluir cartas y productos sellados.","אין תוצאות בתצוגה הזו. נסו את המסנן ״הכול״ כדי לכלול קלפים ומוצרים אטומים."],"Currency":["Devise","货币","통화","通貨","Валюта","Moneda","מטבע"],"Every price in the app is shown in this currency. Rates update each time you open the app.":["Tous les prix de l’application s’affichent dans cette devise. Les taux se mettent à jour à chaque ouverture de l’application.","应用中的所有价格都以此货币显示。每次打开应用时汇率都会更新。","앱의 모든 가격이 이 통화로 표시됩니다. 환율은 앱을 열 때마다 갱신됩니다.","アプリ内のすべての価格がこの通貨で表示されます。為替レートはアプリを開くたびに更新されます。","Все цены в приложении показываются в этой валюте. Курсы обновляются при каждом открытии приложения.","Todos los precios de la aplicación se muestran en esta moneda. Los tipos de cambio se actualizan cada vez que abres la aplicación.","כל המחירים באפליקציה מוצגים במטבע הזה. השערים מתעדכנים בכל פעם שפותחים את האפליקציה."],"US Dollar":["Dollar américain","美元","미국 달러","米ドル","Доллар США","Dólar estadounidense","דולר אמריקאי"],"Canadian Dollar (Default)":["Dollar canadien (par défaut)","加元（默认）","캐나다 달러 (기본값)","カナダドル（デフォルト）","Канадский доллар (по умолчанию)","Dólar canadiense (predeterminado)","דולר קנדי (ברירת מחדל)"],"Australian Dollar":["Dollar australien","澳元","호주 달러","オーストラリアドル","Австралийский доллар","Dólar australiano","דולר אוסטרלי"],"Euro":["Euro","欧元","유로","ユーロ","Евро","Euro","יורו"],"Japanese Yen":["Yen japonais","日元","일본 엔","日本円","Японская иена","Yen japonés","ין יפני"],"British Pound":["Livre sterling","英镑","영국 파운드","英ポンド","Британский фунт","Libra esterlina","לירה שטרלינג"],"Chinese Yuan":["Yuan chinois","人民币","중국 위안","中国人民元","Китайский юань","Yuan chino","יואן סיני"],"Korean Won":["Won sud-coréen","韩元","한국 원","韓国ウォン","Южнокорейская вона","Won surcoreano","וון דרום קוריאני"],"Prices from before Feb 8, 2024 aren’t available from the price source.":["Les prix antérieurs au 8 févr. 2024 ne sont pas disponibles auprès de la source de prix.","2024年2月8日之前的价格无法从价格来源获取。","2024년 2월 8일 이전의 가격은 가격 출처에서 제공되지 않습니다.","2024年2月8日より前の価格は価格情報源から入手できません。","Цены до 8 февраля 2024 г. недоступны в источнике цен.","Los precios anteriores al 8 feb 2024 no están disponibles en la fuente de precios.","מחירים מלפני 8 בפברואר 2024 אינם זמינים ממקור המחירים."],"Older prices haven’t been loaded yet. They fill in once the full history has been downloaded.":["Les anciens prix ne sont pas encore chargés. Ils apparaîtront une fois l’historique complet téléchargé.","较早的价格尚未加载。完整历史记录下载完成后会自动补全。","이전 가격은 아직 불러오지 않았습니다. 전체 기록을 내려받으면 채워집니다.","過去の価格はまだ読み込まれていません。全履歴のダウンロードが完了すると表示されます。","Более старые цены ещё не загружены. Они появятся после загрузки полной истории.","Los precios anteriores aún no se han cargado. Aparecerán cuando se descargue el historial completo.","מחירים ישנים יותר עדיין לא נטענו. הם יתווספו כשההיסטוריה המלאה תורד."],"Over the full range, this shows what the items in this portfolio today were worth over time, back to when the oldest one came out.":["Sur toute la période, ce graphique montre la valeur passée des articles de ce portefeuille tels qu’ils sont aujourd’hui, depuis la sortie du plus ancien.","在完整时间范围内，此图显示当前投资组合中的物品随时间的价值变化，一直追溯到其中最早发行的那件。","전체 기간에서는 현재 이 포트폴리오에 있는 항목이 가장 오래된 항목의 출시 시점부터 시간에 따라 어떤 가치였는지 보여 줍니다.","全期間では、現在このポートフォリオにあるアイテムの価値の推移を、最も古いものが発売された時点までさかのぼって表示します。","За весь период график показывает, сколько стоили со временем предметы, которые сейчас в этом портфеле, начиная с выхода самого старого.","En todo el período, esto muestra cuánto valían con el tiempo los artículos que hoy están en esta cartera, desde que salió el más antiguo.","בטווח המלא מוצג כמה היו שווים לאורך זמן הפריטים שבתיק הזה כיום, מאז יציאת הישן שבהם."],"Symbols":["Symboles","标志","심볼","マーク","Символы","Símbolos","סמלים"],"Set symbols":["Symboles des extensions","系列标志","세트 심볼","セットマーク","Символы наборов","Símbolos de colecciones","סמלי סטים"],"The little emblem printed on every card from Sword & Shield and earlier. Scarlet & Violet and newer cards show a set code instead. Tap a symbol to open its set.":["Le petit emblème imprimé sur chaque carte d’Épée et Bouclier et des séries plus anciennes. Les cartes Écarlate et Violet et plus récentes affichent un code d’extension à la place. Touchez un symbole pour ouvrir son extension.","印在剑与盾及更早所有卡牌上的小标志。朱紫及更新的卡牌改为显示系列代码。点按标志即可打开对应系列。","소드 & 실드 및 그 이전의 모든 카드에 인쇄된 작은 문양입니다. 스칼렛 & 바이올렛 이후의 카드에는 세트 코드가 대신 표시됩니다. 심볼을 누르면 해당 세트가 열립니다.","ソード＆シールド以前のすべてのカードに印刷されている小さなマークです。スカーレット＆バイオレット以降のカードにはセットコードが表示されます。マークをタップするとそのセットが開きます。","Маленький значок, напечатанный на каждой карте с Sword & Shield и более ранних. На картах Scarlet & Violet и новее вместо него указан код набора. Нажмите на символ, чтобы открыть набор.","El pequeño emblema impreso en todas las cartas de Espada y Escudo y anteriores. Las cartas de Escarlata y Púrpura y posteriores muestran un código de colección en su lugar. Toca un símbolo para abrir su colección.","הסמל הקטן שמודפס על כל קלף מ-Sword & Shield ומוקדם יותר. בקלפים של Scarlet & Violet ואילך מופיע קוד סט במקומו. הקישו על סמל כדי לפתוח את הסט שלו."],"Search symbols by set name or era":["Rechercher un symbole par nom d’extension ou d’ère","按系列名称或时代搜索标志","세트 이름 또는 시대로 심볼 검색","セット名または時代でマークを検索","Поиск символов по названию набора или эре","Buscar símbolos por nombre de colección o era","חפשו סמלים לפי שם סט או תקופה"],"No symbol matches your search.":["Aucun symbole ne correspond à votre recherche.","没有符合搜索条件的标志。","검색과 일치하는 심볼이 없습니다.","検索条件に合うマークはありません。","Подходящих символов не найдено.","Ningún símbolo coincide con tu búsqueda.","אין סמל שמתאים לחיפוש."],"Set symbols load from the live card data. They appear once the page is hosted online and the daily sync has saved them.":["Les symboles se chargent depuis les données de cartes en direct. Ils apparaissent une fois la page hébergée en ligne et la synchronisation quotidienne terminée.","系列标志来自实时卡牌数据。页面在线托管且每日同步保存后才会显示。","세트 심볼은 실시간 카드 데이터에서 불러옵니다. 페이지를 온라인에 호스팅하고 매일 동기화가 저장하면 표시됩니다.","セットマークはライブのカードデータから読み込まれます。ページをオンラインで公開し、毎日の同期で保存されると表示されます。","Символы загружаются из актуальных данных о картах. Они появятся, когда страница будет размещена онлайн, а ежедневная синхронизация сохранит их.","Los símbolos se cargan de los datos de cartas en vivo. Aparecen cuando la página está alojada en línea y la sincronización diaria los ha guardado.","הסמלים נטענים מנתוני הקלפים החיים. הם יופיעו כשהדף יתארח באינטרנט והסנכרון היומי ישמור אותם."],"Promo sets, decks and a few sets the symbol source doesn’t cover.":["Séries promo, decks et quelques extensions que la source de symboles ne couvre pas.","特典系列、套牌，以及标志来源未涵盖的少数系列。","프로모 세트, 덱, 그리고 심볼 출처에 없는 일부 세트입니다.","プロモセット、デッキ、およびマークの提供元にない一部のセットです。","Промо-наборы, колоды и несколько наборов, которых нет в источнике символов.","Colecciones promocionales, mazos y algunas colecciones que la fuente de símbolos no cubre.","סטים פרומו, חפיסות וכמה סטים שמקור הסמלים לא מכסה."],"Profile":["Profil","个人资料","프로필","プロフィール","Профиль","Perfil","פרופיל"],"Create an account to add a photo, a bio and your Top 5 cards, and to share your collection with a link.":["Créez un compte pour ajouter une photo, une bio et vos 5 cartes préférées, et partager votre collection avec un lien.","创建账号即可添加头像、简介和你的前 5 张最爱卡牌，并通过链接分享你的收藏。","계정을 만들면 사진, 소개, 즐겨 찾는 카드 Top 5를 추가하고 링크로 컬렉션을 공유할 수 있습니다.","アカウントを作成すると、写真・自己紹介・お気に入りカード TOP5 を追加し、リンクでコレクションを共有できます。","Создайте аккаунт, чтобы добавить фото, описание и пять любимых карт, а также делиться коллекцией по ссылке.","Crea una cuenta para añadir una foto, una biografía y tus 5 cartas favoritas, y compartir tu colección con un enlace.","צרו חשבון כדי להוסיף תמונה, ביו וחמשת הקלפים האהובים עליכם, ולשתף את האוסף שלכם בקישור."],"Public page is on":["Page publique activée","公开页面已开启","공개 페이지 켜짐","公開ページはオン","Публичная страница включена","Página pública activada","הדף הציבורי פעיל"],"Private":["Privé","私密","비공개","非公開","Приватный","Privado","פרטי"],"Edit profile":["Modifier le profil","编辑个人资料","프로필 편집","プロフィールを編集","Редактировать профиль","Editar perfil","עריכת פרופיל"],"‹ Settings":["‹ Réglages","‹ 设置","‹ 설정","‹ 設定","‹ Настройки","‹ Ajustes","‹ הגדרות"],"Your profile":["Votre profil","你的个人资料","내 프로필","あなたのプロフィール","Ваш профиль","Tu perfil","הפרופיל שלכם"],"Change photo":["Changer la photo","更换头像","사진 변경","写真を変更","Сменить фото","Cambiar foto","החלפת תמונה"],"Upload photo":["Importer une photo","上传头像","사진 업로드","写真をアップロード","Загрузить фото","Subir foto","העלאת תמונה"],"Remove photo":["Supprimer la photo","移除头像","사진 삭제","写真を削除","Удалить фото","Quitar foto","הסרת התמונה"],"Display name":["Nom affiché","显示名称","표시 이름","表示名","Отображаемое имя","Nombre visible","שם תצוגה"],"Pron ombre, pronombres, biografía y Top 5. Tu correo y tu nombre de usuario nunca se muestran.","כל מי שיש לו את הקישור יכול לראות את התמונה, השם, כינויי הגוף, הביו וחמשת הקלפים שלכם. האימייל ושם המשתמש שלכם לא מוצגים לעולם."],"On":["Activé","开","켜기","オン","Вкл.","Activado","פעיל"],"Off":["Désactivé","关","끄기","オフ","Выкл.","Desactivado","כבוי"],"Copy link":["Copier le lien","复制链接","링크 복사","リンクをコピー","Копировать ссылку","Copiar enlace","העתקת קישור"],"Share":["Partager","分享","공유","共有","Поделиться","Compartir","שיתוף"],"Copied ✓":["Copié ✓","已复制 ✓","복사됨 ✓","コピーしました ✓","Скопировано ✓","Copiado ✓","הועתק ✓"],"View my public page":["Voir ma page publique","查看我的公开主页","내 공개 페이지 보기","自分の公開ページを見る","Открыть мою публичную страницу","Ver mi página pública","הצגת הדף הציבורי שלי"],"Get a new link":["Obtenir un nouveau lien","获取新链接","새 링크 받기","新しいリンクを取得","Получить новую ссылку","Obtener un enlace nuevo","קבלת קישור חדש"],"Signing out does not take your page offline. Switch it off here to remove it.":["Se déconnecter ne met pas votre page hors ligne. Désactivez-la ici pour la retirer.","退出登录不会让你的页面下线。请在此关闭以将其移除。","로그아웃해도 페이지는 계속 공개됩니다. 삭제하려면 여기서 끄세요.","ログアウトしてもページは公開されたままです。削除するにはここでオフにしてください。","Выход из аккаунта не отключает вашу страницу. Чтобы убрать её, выключите здесь.","Cerrar sesión no desconecta tu página. Desactívala aquí para quitarla.","התנתקות לא מורידה את הדף שלכם מהאינטרנט. כבו אותו כאן כדי להסיר אותו."],"Share my collection":["Partager ma collection","分享我的收藏","내 컬렉션 공유","コレクションを共有","Поделиться коллекцией","Compartir mi colección","שיתוף האוסף שלי"],"Pick the portfolios that show on your page. Pick none to keep your collection private.":["Choisissez les portefeuilles affichés sur votre page. N’en choisissez aucun pour garder votre collection privée.","选择要在你的页面上显示的投资组合。一个都不选则收藏保持私密。","페이지에 표시할 포트폴리오를 선택하세요. 아무것도 선택하지 않으면 컬렉션이 비공개로 유지됩니다.","ページに表示するポートフォリオを選んでください。何も選ばなければコレクションは非公開のままです。","Выберите портфели, которые будут видны на вашей странице. Не выбирайте ни одного, чтобы коллекция осталась приватной.","Elige las carteras que se muestran en tu página. No elijas ninguna para mantener tu colección privada.","בחרו את התיקים שיוצגו בדף שלכם. אל תבחרו אף אחד כדי לשמור את האוסף פרטי."],"Prices and totals":["Prix et totaux","价格和总计","가격 및 합계","価格と合計","Цены и итоги","Precios y totales","מחירים וסכומים"],"Publishing…":["Publication…","正在发布…","게시 중…","公開中…","Публикация…","Publicando…","מפרסם…"],"Published, but your collection is too big to show. Share fewer portfolios.":["Publié, mais votre collection est trop volumineuse pour être affichée. Partagez moins de portefeuilles.","已发布，但你的收藏太大，无法显示。请分享较少的投资组合。","게시되었지만 컬렉션이 너무 커서 표시할 수 없습니다. 공유하는 포트폴리오를 줄여 주세요.","公開しましたが、コレクションが大きすぎて表示できません。共有するポートフォリオを減らしてください。","Опубликовано, но коллекция слишком большая для показа. Поделитесь меньшим числом портфелей.","Publicado, pero tu colección es demasiado grande para mostrarse. Comparte menos carteras.","פורסם, אך האוסף שלכם גדול מכדי להיות מוצג. שתפו פחות תיקים."],"Couldn’t publish. The profiles rule is missing in your Firestore rules (see the setup steps).":["Publication impossible. La règle « profiles » manque dans vos règles Firestore (voir les étapes de configuration).","无法发布。你的 Firestore 规则中缺少 profiles 规则（请参阅设置步骤）。","게시할 수 없습니다. Firestore 규칙에 profiles 규칙이 없습니다(설정 단계를 참고하세요).","公開できませんでした。Firestore のルールに profiles ルールがありません（セットアップ手順を参照）。","Не удалось опубликовать. В правилах Firestore нет правила profiles (см. шаги настройки).","No se pudo publicar. Falta la regla «profiles» en tus reglas de Firestore (consulta los pasos de configuración).","לא ניתן לפרסם. חסר כלל profiles בכללי Firestore שלכם (ראו את שלבי ההגדרה)."],"That file isn’t a picture.":["Ce fichier n’est pas une image.","该文件不是图片。","이 파일은 사진이 아닙니다.","このファイルは画像ではありません。","Этот файл не является изображением.","Ese archivo no es una imagen.","הקובץ הזה אינו תמונה."],"Couldn’t read that picture. Try a JPG or PNG.":["Impossible de lire cette image. Essayez un JPG ou un PNG.","无法读取这张图片。请尝试 JPG 或 PNG 格式。","이 사진을 읽을 수 없습니다. JPG 또는 PNG를 시도해 보세요.","この画像を読み込めませんでした。JPG または PNG をお試しください。","Не удалось прочитать это изображение. Попробуйте JPG или PNG.","No se pudo leer esa imagen. Prueba con un JPG o PNG.","לא ניתן לקרוא את התמונה. נסו JPG או PNG."],"Pick a favorite card":["Choisir une carte préférée","选择一张最爱卡牌","즐겨 찾는 카드 고르기","お気に入りカードを選ぶ","Выберите любимую карту","Elige una carta favorita","בחירת קלף אהוב"],"Search for any card by name or set.":["Recherchez n’importe quelle carte par nom ou par set.","按名称或系列搜索任意卡牌。","이름이나 세트로 카드를 검색하세요.","名前またはセットでカードを検索します。","Ищите любую карту по названию или сету.","Busca cualquier carta por nombre o set.","חפשו כל קלף לפי שם או סט."],"Search any card or set":["Rechercher une carte ou un set","搜索任意卡牌或系列","카드 또는 세트 검색","カードまたはセットを検索","Поиск любой карты или сета","Buscar una carta o un set","חיפוש קלף או סט"],"☆ Add to my Top 5":["☆ Ajouter à mon Top 5","☆ 加入我的前 5 名","☆ 내 Top 5에 추가","☆ 自分の TOP5 に追加","☆ Добавить в мой Топ-5","☆ Añadir a mi Top 5","☆ הוספה לחמשת הקלפים שלי"],"★ In your Top 5 · Remove":["★ Dans votre Top 5 · Retirer","★ 已在你的前 5 名 · 移除","★ 내 Top 5에 있음 · 삭제","★ TOP5 に登録済み · 削除","★ В вашем Топ-5 · Убрать","★ En tu Top 5 · Quitar","★ בחמשת הקלפים שלכם · הסרה"],"Get a new link?":["Obtenir un nouveau lien ?","获取新链接？","새 링크를 받을까요?","新しいリンクを取得しますか？","Получить новую ссылку?","¿Obtener un enlace nuevo?","לקבל קישור חדש?"],"The old link stops working right away. Anyone who still has it will see “Profile not found”.":["L’ancien lien cesse de fonctionner immédiatement. Toute personne qui l’a encore verra « Profil introuvable ».","旧链接会立即失效。仍持有它的人将看到“未找到个人资料”。","이전 링크는 즉시 작동하지 않게 됩니다. 아직 링크를 가진 사람에게는 “프로필을 찾을 수 없음”이 표시됩니다.","古いリンクはすぐに使えなくなります。まだ持っている人には「プロフィールが見つかりません」と表示されます。","Старая ссылка сразу перестанет работать. Те, у кого она осталась, увидят «Профиль не найден».","El enlace anterior deja de funcionar al instante. Quien aún lo tenga verá «Perfil no encontrado».","הקישור הישן מפסיק לעבוד מיד. מי שעדיין מחזיק בו יראה “הפרופיל לא ossible de charger la liste. Vérifiez votre connexion et réessayez.","无法加载列表。请检查网络连接后重试。","목록을 불러올 수 없습니다. 연결을 확인한 후 다시 시도하세요.","リストを読み込めませんでした。接続を確認してもう一度お試しください。","Не удалось загрузить список. Проверьте подключение и повторите попытку.","No se pudo cargar la lista. Comprueba tu conexión e inténtalo de nuevo.","לא ניתן לטעון את הרשימה. בדקו את החיבור ונסו שוב."],"No one is listed yet. Be the first!":["Personne n’est encore listé. Soyez le premier !","还没有人公开列出。来当第一个吧！","아직 목록에 등록된 사람이 없습니다. 첫 번째가 되어 보세요!","まだ誰も掲載されていません。最初の1人になりましょう！","Пока в списке никого нет. Станьте первым!","Todavía no hay nadie en la lista. ¡Sé el primero!","עדיין אף אחד לא ברשימה. היו הראשונים!"],"Have a profile link?":["Vous avez un lien de profil ?","有个人资料链接吗？","프로필 링크가 있나요?","プロフィールのリンクをお持ちですか？","Есть ссылка на профиль?","¿Tienes un enlace de perfil?","יש לכם קישור לפרופיל?"],"Paste it here to open that page.":["Collez-le ici pour ouvrir cette page.","粘贴到这里即可打开该页面。","여기에 붙여넣으면 해당 페이지가 열립니다.","ここに貼り付けるとそのページが開きます。","Вставьте её сюда, чтобы открыть страницу.","Pégalo aquí para abrir esa página.","הדביקו אותו כאן כדי לפתוח את הדף."],"Paste a profile link":["Collez un lien de profil","粘贴个人资料链接","프로필 링크 붙여넣기","プロフィールのリンクを貼り付け","Вставьте ссылку на профиль","Pega un enlace de perfil","הדביקו קישור לפרופיל"],"Open profile":["Ouvrir le profil","打开个人资料","프로필 열기","プロフィールを開く","Открыть профиль","Abrir perfil","פתיחת פרופיל"],"That doesn’t look like a profile link.":["Ceci ne ressemble pas à un lien de profil.","这看起来不像个人资料链接。","프로필 링크처럼 보이지 않습니다.","プロフィールのリンクではないようです。","Это не похоже на ссылку на профиль.","Eso no parece un enlace de perfil.","זה לא נראה כמו קישור לפרופיל."],"Want your own profile?":["Envie d’avoir votre propre profil ?","想要自己的个人资料吗？","나만의 프로필을 만들고 싶나요?","自分のプロフィールを作りませんか？","Хотите свой профиль?","¿Quieres tu propio perfil?","רוצים פרופיל משלכם?"],"Create an account to add a photo, a bio and your Top 5 cards, and to be listed here.":["Créez un compte pour ajouter une photo, une bio et vos 5 cartes préférées, et apparaître ici.","创建账号即可添加头像、简介和你的前 5 张最爱卡牌，并在这里公开列出。","계정을 만들면 사진, 소개, 즐겨 찾는 카드 Top 5를 추가하고 이곳에 등록할 수 있습니다.","アカウントを作成すると、写真・自己紹介・お気に入りカード TOP5 を追加し、ここに掲載できます。","Создайте аккаунт, чтобы добавить фото, описание и пять любимых карт и попасть в этот список.","Crea una cuenta para añadir una foto, una biografía y tus 5 cartas favoritas, y aparecer aquí.","צרו חשבון כדי להוסיף תמונה, ביו וחמשת הקלפים האהובים עליכם, ולהופיע כאן."],"Want to be listed here?":["Envie d’être listé ici ?","想在这里公开列出吗？","이곳에 등록하고 싶나요?","ここに掲載しませんか？","Хотите попасть в этот список?","¿Quieres aparecer aquí?","רוצים להופיע כאן?"],"Turn on your public page, then switch on Community listing.":["Activez votre page publique, puis activez l’inscription à la Communauté.","先开启你的公开页面，然后打开“社区列表”。","공개 페이지를 켠 다음 커뮤니티 목록을 켜세요.","公開ページをオンにしてから、コミュニティ掲載をオンにしてください。","Включите публичную страницу, затем включите показ в сообществе.","Activa tu página pública y luego activa la lista de la comunidad.","הפעילו את הדף הציבורי שלכם ואז הפעילו את הרישום בקהילה."],"Remove this collector?":["Retirer ce collectionneur ?","移除这位收藏家？","이 수집가를 삭제할까요?","このコレクターを削除しますか？","Убрать этого коллекционера?","¿Quitar a este coleccionista?","להסיר את האספן הזה?"],"Their Community listing and public page will be deleted. They can list themselves again later.":["Leur inscription à la Communauté et leur page publique seront supprimées. Ils pourront se réinscrire plus tard.","他们的社区列表和公开页面将被删除。之后他们可以重新公开列出。","커뮤니티 목록과 공개 페이지가 삭제됩니다. 나중에 다시 등록할 수 있습니다.","コミュニティの掲載と公開ページが削除されます。後でもう一度掲載することもできます。","Их запись в сообществе и публичная страница будут удалены. Позже они смогут снова попасть в список.","Se eliminarán su entrada en la comunidad y su página pública. Podrán volver a aparecer más adelante.","הרישום שלהם בקהילה והדף הציבורי שלהם יימחקו. הם יוכלו להירשם שוב מאוחר יותר."],"Remove from Community":["Retirer de la Communauté","从社区移除","커뮤니티에서 삭제","コミュニティから削除","Убрать из сообщества","Quitar de la comunidad","הסרה מהקהילה"],"Community listing":["Inscription à la Communauté","社区列表","커뮤니티 목록","コミュニティ掲載","Показ в сообществе","Lista de la comunidad","רישום בקהילה"],"Show your name, photo, pronouns and the start of your bio in the Community tab so other collectors can find you.":["Affichez votre nom, votre photo, vos pronoms et le début de votre bio dans l’onglet Communauté pour que les autres collectionneurs vous trouvent.","在“社区”标签页显示你的名称、头像、代词和简介开头，让其他收藏家能找到你。","커뮤니티 탭에 이름, 사진, 대명사, 소개 앞부분을 표시해 다른 수집가가 나를 찾을 수 있게 합니다.","コミュニティタブに名前・写真・代名詞・自己紹介の冒頭を表示し、ほかのコレクターが見つけられるようにします。","Показывайте имя, фото, местоимения и начало описания во вкладке «Сообщество», чтобы другие коллекционеры могли вас найти.","Muestra tu nombre, foto, pronombres y el comienzo de tu biografía en la pestaña Comunidad para que otros coleccionistas te encuentren.","הציגו את השם, התמונה, כינויי הגוף ותחילת הביו שלכם בלשונית הקהילה כדי שאספנים אחרים יוכלו למצוא אתכם."],"Couldn’t list you in Community. The directory rule is missing in your Firestore rules (see the setup steps).":["Impossible de vous inscrire à la Communauté. La règle « directory » manque dans vos règles Firestore (voir les étapes de configuration).","无法将你列入社区。你的 Firestore 规则中缺少 directory 规则（请参阅设置步骤）。","커뮤니티에 등록할 수 없습니다. Firestore 규칙에 directory 규칙이 없습니다(설정 단계를 참고하세요).","コミュニティに掲載できませんでした。Firestore のルールに directory ルールがありません（セットアップ手順を参照）。","Не удалось добавить вас в сообщество. В правилах Firestore нет правила directory (см. шаги настройки).","No se pudo añadirte a la comunidad. Falta la regla «directory» en tus reglas de Firestore (consulta los pasos de configuración).","לא ניתן לרשום אתכם בקהילה. חסר כלל directory בכללי Firestore שלכם (ראו את שלבי ההגדרה)."],"Owner":["Propriétaire","所有者","소유자","オーナー","Владелец","Propietario","בעלים"],"Staff":["Équipe","工作人员","스태프","スタッフ","Команда","Equipo","צוות"],"Verified":["Vérifié","已认证","인증됨","認証済み","Подтверждён","Verificado","מאומת"],"Verify your email":["Vérifiez votre e-mail","验证你的邮箱","이메일을 인증하세요","メールアドレスを確認してください","Подтвердите свою почту","Verifica tu correo","אמתו את האימייל שלכם"],"Your email isn’t verified yet, so the Owner, Staff and check mark badges stay off. Send yourself a link, open it, then tap “I’ve verified”.":["Votre e-mail n’est pas encore vérifié, donc les badges Propriétaire, Équipe et coche restent désactivés. Envoyez-vous un lien, ouvrez-le, puis touchez « J’ai vérifié ».","你的邮箱尚未验证，因此“所有者”“工作人员”和勾选徽章保持关闭。给自己发送一个链接，打开它，然后点按“我已验证”。","이메일이 아직 인증되지 않아 소유자, 스태프, 체크 배지가 꺼져 있습니다. 인증 링크를 받아 열고 “인증했어요”를 누르세요.","メールアドレスがまだ確認されていないため、オーナー、スタッフ、チェックマークのバッジはオフのままです。リンクを自分に送り、開いてから「確認しました」をタップしてください。","Ваша почта ещё не подтверждена, поэтому значки «Владелец», «Команда» и галочка отключены. Отправьте себе ссылку, откройте её и нажмите «Я подтвердил(а)».","Tu correo aún no está verificado, así que las insignias de Propietario, Equipo y la marca de verificación siguen desactivadas. Envíate un enlace, ábrelo y toca «Ya verifiqué».","האימייל שלכם עדיין לא אומת, ולכן תגי הבעלים, הצוות וסימן הוי כבויים. שלחו לעצמכם קישור, פתחו אותו ואז הקישו על «אימתתי»."],"Send verification email":["Envoyer l’e-mail de vérification","发送验证邮件","인증 이메일 보내기","確認メールを送信","Отправить письмо для подтверждения","Enviar correo de verificación","שליחת אימייל אימות"],"I’ve verified":["J’ai vérifié","我已验证","인증했어요","確認しました","Я подтвердил(а)","Ya verifiqué","אימתתי"],"Verification email sent. Open the link in it, then come back and tap “I’ve verified”.":["E-mail de vérification envoyé. Ouvrez le lien qu’il contient, puis revenez et touchez « J’ai vérifié ».","验证邮件已发送。打开其中的链接，然后回来点按“我已验证”。","인증 이메일을 보냈습니다. 메일의 링크를 열고 돌아와서 “인증했어요”를 누르세요.","確認メールを送信しました。メール内のリンクを開いてから、戻って「確認しました」をタップしてください。","Письмо для подтверждения отправлено. Откройте ссылку в нём, затем вернитесь и нажмите «Я подтвердил(а)».","Correo de verificación enviado. Abre el enlace que contiene y vuelve para tocar «Ya verifiqué».","אימייל האימות נשלח. פתחו את הקישור שבו, חזרו והקישו על «אימתתי»."],"Couldn’t send the email. Try again in a moment.":["Impossible d’envoyer l’e-mail. Réessayez dans un instant.","无法发送邮件。请稍后重试。","이메일을 보낼 수 없습니다. 잠시 후 다시 시도하세요.","メールを送信できませんでした。しばらくしてからもう一度お試しください。","Не удалось отправить письмо. Повторите попытку чуть позже.","No se pudo enviar el correo. Inténtalo de nuevo en un momento.","לא ניתן היה לשלוח את האימייל. נסו שוב בעוד רגע."],"Too many tries. Wait a few minutes, then try again.":["Trop de tentatives. Patientez quelques minutes, puis réessayez.","尝试次数过多。请等待几分钟后再试。","시도 횟수가 너무 많습니다. 몇 분 기다린 후 다시 시도하세요.","試行回数が多すぎます。数分待ってからもう一度お試しください。","Слишком много попыток. Подождите несколько минут и повторите.","Demasiados intentos. Espera unos minutos y vuelve a intentarlo.","יותר מדי ניסיונות. המתינו כמה דקות ונסו שוב."],"Not verified yet. Open the link in the email first, then tap again.":["Pas encore vérifié. Ouvrez d’abord le lien dans l’e-mail, puis touchez à nouveau.","尚未验证。请先打开邮件中的链接，然后再次点按。","아직 인증되지 않았습니다. 먼저 이메일의 링크를 열고 다시 누르세요.","まだ確認されていません。先にメール内のリンクを開いてから、もう一度タップしてください。","Ещё не подтверждено. Сначала откройте ссылку в письме, затем нажмите снова.","Aún no verificado. Primero abre el enlace del correo y vuelve a tocar.","עדיין לא אומת. פתחו קודם את הקישור באימייל ואז הקישו שוב."],"Staff panel":["Panneau de l’équipe","工作人员面板","스태프 패널","スタッフパネル","Панель команды","Panel del equipo","לוח הצוות"],"Remove users, put them on timeout and change the site logo.":["Retirez des utilisateurs, mettez-les en exclusion temporaire et changez le logo du site.","移除用户、对其暂时限制，并更换网站标志。","사용자를 삭제하고, 타임아웃을 적용하고, 사이트 로고를 바꿀 수 있습니다.","ユーザーの削除、タイムアウト、サイトロゴの変更ができます。","Удаляйте пользователей, отправляйте их в тайм-аут и меняйте логотип сайта.","Elimina usuarios, suspéndelos temporalmente y cambia el logotipo del sitio.","הסירו משתמשים, השעו אותם זמנית ושנו את לוגו האתר."],"Open staff panel":["Ouvrir le panneau de l’équipe","打开工作人员面板","스태프 패널 열기","スタッフパネルを開く","Открыть панель команды","Abrir el panel del equipo","פתיחת לוח הצוות"],"On timeout":["Exclusion temporaire","限制中","타임아웃 중","タイムアウト中","Тайм- 削除、タイムアウト、サイトロゴの変更ができるようになります。","Они получат значок «Команда» и эту панель. Смогут удалять пользователей, отправлять их в тайм-аут и менять логотип сайта.","Recibirán la insignia de Equipo y este panel. Podrán eliminar usuarios, suspenderlos temporalmente y cambiar el logotipo del sitio.","הם יקבלו את תג הצוות ואת הלוח הזה. הם יוכלו להסיר משתמשים, להשעות אותם זמנית ולשנות את לוגו האתר."],"Timeout set. They’re off the Community list.":["Exclusion appliquée. Ils ne sont plus dans la liste de la Communauté.","已设置限制，他们已从社区列表中移除。","타임아웃을 적용했습니다. 커뮤니티 목록에서 제외되었습니다.","タイムアウトを設定しました。コミュニティの一覧から外れました。","Тайм-аут назначен. Их больше нет в списке сообщества.","Suspensión aplicada. Ya no están en la lista de la comunidad.","ההשעיה הוגדרה. הם הוסרו מרשימת הקהילה."],"User removed.":["Utilisateur retiré.","用户已移除。","사용자를 삭제했습니다.","ユーザーを削除しました。","Пользователь удалён.","Usuario eliminado.","המשתמש הוסר."],"Timeout lifted.":["Exclusion levée.","已解除限制。","타임아웃을 해제했습니다.","タイムアウトを解除しました。","Тайм-аут снят.","Suspensión levantada.","ההשעיה בוטלה."],"They’re staff now. The badge appears the next time they open the app.":["Ils font maintenant partie de l’équipe. Le badge apparaîtra à leur prochaine ouverture de l’appli.","他们现在是工作人员了，徽章会在他们下次打开应用时出现。","이제 스태프입니다. 다음에 앱을 열면 배지가 표시됩니다.","スタッフになりました。次にアプリを開いたときにバッジが表示されます。","Теперь они в команде. Значок появится при следующем открытии приложения.","Ya forman parte del equipo. La insignia aparecerá la próxima vez que abran la app.","הם חלק מהצוות עכשיו. התג יופיע בפעם הבאה שיפתחו את האפליקציה."],"Staff removed.":["Retiré de l’équipe.","已移除工作人员。","스태프를 해제했습니다.","スタッフを解除しました。","Убран из команды.","Quitado del equipo.","הוסר מהצוות."],"Logo updated.":["Logo mis à jour.","标志已更新。","로고를 업데이트했습니다.","ロゴを更新しました。","Логотип обновлён.","Logotipo actualizado.","הלוגו עודכן."],"Logo reset.":["Logo rétabli.","标志已恢复默认。","로고를 기본값으로 되돌렸습니다.","ロゴを初期設定に戻しました。","Логотип сброшен.","Logotipo restablecido.","הלוגו אופס."],"Couldn’t change the logo. Try a different picture.":["Impossible de changer le logo. Essayez une autre image.","无法更换标志。请换一张图片试试。","로고를 바꿀 수 없습니다. 다른 사진으로 시도하세요.","ロゴを変更できませんでした。別の画像でお試しください。","Не удалось сменить логотип. Попробуйте другую картинку.","No se pudo cambiar el logotipo. Prueba con otra imagen.","לא ניתן לשנות את הלוגו. נסו תמונה אחרת."],"Camera Scan Feature is currently in Beta, this feature may or may not work.":["La fonction de scan par caméra est actuellement en bêta ; elle peut fonctionner ou non.","相机扫描功能目前为测试版，可能能用，也可能不能用。","카메라 스캔 기능은 현재 베타 버전이며, 작동하지 않을 수도 있습니다.","カメラスキャン機能は現在ベータ版です。動作しない場合があります。","Функция сканирования камерой сейчас в бета-версии и может как работать, так и не работать.","La función de escaneo con cámara está actualmente en beta y puede que funcione o no.","תכונת סריקת המצלמה נמצאת כרגע בגרסת בטא, ויכול להיות שהיא תעבוד ויכול להיות שלא."],"All portfolios":["Tous les portefeuilles","所有投资组合","모든 포트폴리오","すべてのポートフォリオ","Все портфели","Todas las carteras","כל התיקים"],"Portfolios":["Portefeuilles","投资组合","포트폴리오","ポートフォリオ","Портфели","Carteras","תיקים"],"In this portfolio":["Dans ce portefeuille","在此投资组合中","이 포트폴리오에 있음","このポートフォリオに入っています","В этом портфеле","En esta cartera","בתיק הזה"],"Pick the portfolios whose cards show on your page. Your page also shows the total number of cards and the total value across all your portfolios. Hide prices to remove the value.":["Choisissez les portefeuilles dont les cartes sont affichées sur votre page. Votre page affiche aussi le nombre total de cartes et la valeur totale de tous vos portefeuilles. Masquez les prix pour retirer la valeur.","选择其卡牌显示在你页面上的投资组合。你的页面还会显示所有投资组合的卡牌总数和总价值。隐藏价格即可去掉总价值。","카드를 페이지에 표시할 포트폴리오를 선택하세요. 페이지에는 모든 포트폴리오의 카드 총 수와 총 가치도 함께 표시됩니다. 가격을 숨기면 가치가 제거됩니다.","カードをページに表示するポートフォリオを選んでください。ページには、すべてのポートフォリオの合計枚数と合計金額も表示されます。価格を非表示にすると金額は表示されなくなります。","Выберите портфели, карты из которых будут видны на вашей странице. На странице также показываются общее число карт и общая стоимость по всем вашим портфелям. Скройте цены, чтобы
