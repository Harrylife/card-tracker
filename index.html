 card data of their own use the Japanese release of the same set, and sets with no Japanese match are listed with no cards yet.":["Les cartes dans cette langue n’ont pas de prix publiés. Les prix précédés de ≈ sont des estimations tirées de la carte japonaise correspondante ; ces cartes se vendent généralement moins cher. Les sets sans données propres utilisent l’édition japonaise du même set, et ceux sans équivalent japonais sont listés sans cartes pour l’instant.","此语言的卡牌没有公开价格。带 ≈ 的价格是根据对应日文卡牌估算的，通常实际售价更低。没有自身卡牌数据的系列会使用同一系列的日文版，找不到日文对应的系列则暂时不显示卡牌。","이 언어의 카드에는 공개된 가격이 없습니다. ≈ 표시 가격은 해당하는 일본어 카드로 추정한 값이며, 보통 더 저렴하게 팔립니다. 자체 카드 데이터가 없는 세트는 같은 세트의 일본어판을 사용하고, 일본어 대응 세트가 없는 세트는 아직 카드 없이 표시됩니다.","この言語のカードには公開価格がありません。≈ 付きの価格は対応する日本語版カードからの推定値で、通常はより安く売られています。独自のカードデータがないセットは同じセットの日本語版を使い、日本語版にも対応がないセットはカードなしで表示されます。","У карт на этом языке нет опубликованных цен. Цены со знаком ≈ — оценки по соответствующей японской карте; такие карты обычно продаются дешевле. Наборы без собственных данных используют японскую версию того же набора, а наборы без японского аналога показаны без карт.","Las cartas en este idioma no tienen precios publicados. Los precios con ≈ son estimaciones de la carta japonesa equivalente y suelen venderse por menos. Las colecciones sin datos propios usan la edición japonesa de la misma colección, y las que no tienen equivalente japonés aparecen sin cartas por ahora.","לקלפים בשפה הזו אין מחירים מפורסמים. מחירים עם ≈ הם הערכות לפי הקלף היפני התואם, ובדרך כלל הם נמכרים בפחות. סטים ללא נתוני קלפים משלהם משתמשים בגרסה היפנית של אותו סט, וסטים ללא התאמה יפנית מופיעים בלי קלפים בינתיים."],"Loading sets…":["Chargement des sets…","正在加载系列…","세트 불러오는 중…","セットを読み込み中…","Загрузка наборов…","Cargando colecciones…","טוען סטים…"],"Loading Japanese sets…":["Chargement des sets japonais…","正在加载日文系列…","일본어 세트 불러오는 중…","日本語版セットを読み込み中…","Загрузка японских наборов…","Cargando colecciones japonesas…","טוען סטים יפניים…"],"Loading…":["Chargement…","加载中…","불러오는 중…","読み込み中…","З s precios con ≈ son estimaciones de la carta japonesa y suelen venderse por menos.","אין נתוני קלפים לסט הזה, ולכן הקלפים, התמונות והמוצרים האטומים לקוחים מהמהדורה היפנית של אותו סט (הקלף המודפס עשוי להיות ממוספר או להיראות מעט אחרת). לקלפים האלה אין מחירים מפורסמים. מחירים עם ≈ הם הערכות לפי הקלף היפני, ובדרך כלל הם נמכרים בפחות."],"These cards have no published prices. Prices marked ≈ are estimates from the matching Japanese card (they usually sell for less), and the sealed products listed are the Japanese equivalents.":["Ces cartes n’ont pas de prix publiés. Les prix marqués ≈ sont estimés d’après la carte japonaise correspondante (ils sont généralement plus bas), et les produits scellés listés sont les équivalents japonais.","这些卡牌没有公开价格。带 ≈ 的价格是根据对应日文卡牌估算的（通常实际售价更低），所列密封产品为日文版对应产品。","이 카드에는 공개된 가격이 없습니다. ≈ 표시 가격은 해당하는 일본어 카드로 추정한 값이며(보통 더 저렴함), 표시된 미개봉 제품은 일본어판 제품입니다.","これらのカードには公開価格がありません。≈ 付きの価格は対応する日本語版カードからの推定値（通常はより安価）で、表示されている未開封商品は日本語版のものです。","У этих карт нет опубликованных цен. Цены со знаком ≈ — оценки по соответствующей японской карте (обычно они ниже), а перечисленные запечатанные товары — японские аналоги.","Estas cartas no tienen precios publicados. Los precios con ≈ son estimaciones de la carta japonesa equivalente (suelen ser menores) y los productos sellados son los equivalentes japoneses.","לקלפים האלה אין מחירים מפורסמים. מחירים עם ≈ הם הערכות לפי הקלף היפני התואם (בדרך כלל נמוכים יותר), והמוצרים האטומים הרשומים הם המקבילים היפניים."],"No Japanese match was found for this set, so there are no price estimates.":["Aucune correspondance japonaise n’a été trouvée pour ce set, il n’y a donc pas d’estimation de prix.","没有找到此系列的日文对应，因此没有价格估算。","이 세트와 일치하는 일본어 세트를 찾지 못해 가격 추정치가 없습니다.","このセットに対応する日本語版が見つからなかったため、価格の推定はありません。","Японского аналога для этого набора не найдено, поэтому оценок цен нет.","No se encontró equivalente japonés para esta colección, así que no hay precios estimados.","לא נמצאה התאמה יפנית לסט הזה, ולכן אין הערכות מחיר."],"No sealed грузится вместе с живыми данными","El total de cartas se carga con los datos en vivo","מספר הקלפים הכולל נטען עם הנתונים החיים"],"Showing sample data.":["Affichage de données d’exemple.","当前显示示例数据。","샘플 데이터를 표시하고 있습니다.","サンプルデータを表示しています。","Показаны примерные данные.","Mostrando datos de ejemplo.","מוצגים נתוני דוגמה."],"Sample cards and demo prices in CAD. Live prices and card images load when the page is hosted online.":["Cartes d’exemple et prix de démonstration en CAD. Les prix en direct et les images des cartes se chargent quand la page est hébergée en ligne.","示例卡牌与演示价格（加元）。页面在线托管后会加载实时价格和卡牌图片。","CAD 기준의 샘플 카드와 데모 가격입니다. 페이지를 온라인에 호스팅하면 실시간 가격과 카드 이미지가 불러와집니다.","CAD のサンプルカードとデモ価格です。ページをオンラインで公開すると、ライブ価格とカード画像が読み込まれます。","Примерные карты и демонстрационные цены в CAD. Актуальные цены и изображения загрузятся, когда страница будет размещена онлайн.","Cartas de ejemplo y precios de demostración en CAD. Los precios en vivo y las imágenes se cargan cuando la página está alojada en línea.","קלפי דוגמה ומחירי הדגמה ב-CAD. מחירים חיים ותמונות קלפים נטענים כשהדף מתארח באינטרנט."],"Scanner":["Scanner","扫描器","스캐너","スキャナー","Сканер","Escáner","סורק"],"The scanner needs live data. Open the hosted app.":["Le scanner nécessite des données en direct. Ouvrez l’application hébergée.","扫描器需要实时数据。请打开在线托管的应用。","스캐너에는 실시간 데이터가 필요합니다. 호스팅된 앱을 여세요.","スキャナーにはライブデータが必要です。公開されているアプリを開いてください。","Для сканера нужны живые данные. Откройте размещённое приложение.","El escáner necesita datos en vivo. Abre la app alojada en línea.","הסורק דורש נתונים חיים. פתחו את האפליקציה המתארחת."],"Fit the whole card inside the frame · tap the picture to focus":["Placez toute la carte dans le cadre · touchez l’image pour faire la mise au point","将整张卡牌放入框内 · 点按画面对焦","카드 전체를 프레임 안에 맞추세요 · 화면을 눌러 초점 맞추기","カード全体を枠内に収めてください · 画面をタップしてピント合わせ","Поместите всю карту в рамку · коснитесь изображения для фокусировки","Encaja toda la carta en el marco · toca la imagen para enfocar","הכניסו את כל הקלף למסגרת · גענו בתמונה כדי למקד"],"Focus":["Mise au point","对焦","초점","ピント","Фокус","Enfocar","מיקוד"],"Lens":["Objectif","镜头","렌즈","レンズ","Объектив","Lente","עדשה"],"Photo":["Photo","拍照","사진","写真","Фото","Foto","תמונה"],"Start scanning":["Lancer le scan","开始扫描","스캔 시작","スキャン開始","Начать сканирование","Empezar a escanear","התחלת סריקה"],"Stop scanning":["Arrêter le scan","停止扫描","스캔 중지","スキャン停止","Остановить сканирование","Detener escaneo","עצירת סריקה"],"Fit the card inside the frame and tap the picture to focus. Then press":["Placez la carte dans le cadre et touchez l’image pour faire la mise au point. Appuyez ensuite sur","将卡牌放入框内并点按画面对焦，然后点击","카드를 프레임 안에 맞추고 화면을 눌러 초점을 맞춘 다음, 이 버튼을 누르세요:","カードを枠内に収め、画面をタップしてピントを合わせ、次のボタンを押してください：","Поместите карту в рамку и коснитесь изображения для фокусировки. Затем нажмите","Encaja la carta en el marco y toca la imagen para enfocar. Luego pulsa","הכניסו את הקלף למסגרת וגענו בתמונה כדי למקד. לאחר מכן לחצו על"],"Looking for a card, graded slab or sealed product. Fit it inside the frame and keep the card number at the bottom in view.":["Recherche d’une carte, d’une capsule gradée ou d’un produit scellé. Placez-le dans le cadre et gardez le numéro de la carte visible en bas.","正在识别卡牌、评级盒或密封产品。请将其放入框内，并让底部的卡牌编号保持可见。","카드, 등급 슬랩 또는 미개봉 제품을 찾는 중입니다. 프레임 안에 맞추고 하단의 카드 번호가 보이게 하세요.","カード・鑑定ケース・未開封商品を探しています。枠内に収め、下部のカード番号が見えるようにしてください。","Ищу карту, слаб или запечатанный товар. Поместите его в рамку и держите номер карты внизу в кадре.","Buscando una carta, una slab graduada o un producto sellado. Encájalo en el marco y mantén visible el número de la carta en la parte inferior.","מחפש קלף, מארז מדורג או מוצר אטום. הכניסו אותו למסגרת והשאירו את מספר הקלף בתחתית בתוך הפריים."],"Starting camera…":["Démarrage de la caméra…","正在启动相机…","카메라 시작 중…","カメラを起動中…","Запуск камеры…","Iniciando la cámara…","מפעיל מצלמה…"],"Loading the scanner (the first time takes a moment)…":["Chargement du scanner (la première fois prend un instant)…","正在加载扫描器（首次加载需要一点时间）…","스캐너 불러오는 중(처음에는 시간이
