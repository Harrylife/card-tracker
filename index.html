<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Card Tracker</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#6c4cff"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f3f2fb;--sf:#fff;--tx:#15142b;--mu:#6d6b8c;--ac:#6c4cff;--up:#0fa968;--bd:#e2e0f1;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0b1a;--sf:#171629;--tx:#f2f1ff;--mu:#9a98bd;--ac:#8a6dff;--bd:#2a2848;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c0b1a;--sf:#171629;--tx:#f2f1ff;--mu:#9a98bd;--ac:#8a6dff;--bd:#2a2848;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:520px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:24px;margin:4px 0 10px}
.mu{color:var(--mu)}
.bn{font-size:12px;color:var(--mu);margin-bottom:12px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px}
.tot{padding:20px;margin-bottom:14px;background:linear-gradient(135deg,#7a5cff,#3a22b8);color:#fff;border-radius:20px}
.tot b{display:block;font-size:36px;margin:2px 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}
.chip{flex:none;padding:8px 14px;border-radius:99px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);font:inherit;cursor:pointer}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.row{display:flex;gap:12px;align-items:center;padding:10px;margin-bottom:8px;cursor:pointer}
.th{width:46px;height:64px;border-radius:6px;flex:none;display:grid;place-items:center;color:#fff;overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover}
.mid{flex:1;min-width:0}
.mid b,.mid span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mid span{color:var(--mu);font-size:12px}
.rt{text-align:right}.pr{font-weight:700}
.qt{display:inline-flex;align-items:center;gap:8px;margin-top:4px}
.qt button{width:26px;height:26px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sb{padding:0;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.sb em{display:block;font-style:normal;font-size:12px;color:var(--mu);margin-top:4px}
.lg{position:relative;height:96px;border-radius:14px;color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:8px;overflow:hidden}
.lg small{font-size:11px;opacity:.85}.lg strong{font-size:17px;line-height:1.15}
.lg img{max-width:100%;max-height:100%;object-fit:contain}
.lg.has small,.lg.has strong{display:none}
input,select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);font:inherit;margin-bottom:12px}
.bt{width:100%;padding:13px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.bt.g{background:var(--sf);color:var(--tx);border:1px solid var(--bd);margin-top:8px}
.lk{background:none;border:0;color:var(--mu);font:inherit;padding:12px 0;cursor:pointer}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--sf);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:10px 0 8px;border:0;background:none;color:var(--mu);font:inherit;font-size:12px;cursor:pointer}
nav button.on{color:var(--ac);font-weight:700}
nav i{display:block;font-style:normal;font-size:20px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;z-index:5}
.ov[hidden]{display:none}
.sheet{width:100%;max-width:520px;margin:0 auto;background:var(--sf);border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
.big{width:120px;height:168px;margin:0 auto 12px;font-size:34px}
.sheet h2{margin:0 0 2px;font-size:20px;text-align:center}.sheet p{text-align:center;margin:0 0 10px}
.sheet .pr{font-size:28px;text-align:center;margin-bottom:12px}
.sq{display:flex;justify-content:center;align-items:center;gap:18px;margin-bottom:12px;font-size:20px}
.sq button{width:40px;height:40px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:20px;cursor:pointer}
#app h2{font-size:15px;margin:20px 0 8px;color:var(--mu)}
.cp{padding:14px;margin-bottom:12px}.cp b{display:block;font-size:18px}
.pg{height:8px;border-radius:99px;background:var(--bd);margin-top:10px;overflow:hidden}.pg i{display:block;height:100%;background:var(--up)}
.list,.top{display:block}
@media(min-width:900px){
body{padding-left:210px}
nav{top:0;right:auto;width:210px;flex-direction:column;justify-content:flex-start;gap:4px;padding:20px 12px;border-top:0;border-right:1px solid var(--bd)}
nav button{flex:none;display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border-radius:12px;font-size:15px}
nav button.on{background:var(--bg)}
nav i{display:inline;font-size:20px}
#app{max-width:1180px;padding:28px 36px 48px}
h1{font-size:28px}
.top{display:grid;grid-template-columns:minmax(260px,1fr) 2fr;gap:16px;margin-bottom:16px}
.top .tot,.top .cp{margin:0}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:10px}
.list .row{margin:0}
.grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.lg{height:110px}
.chips{flex-wrap:wrap;overflow:visible}
.ov{align-items:center}
.sheet{border-radius:20px;max-width:460px}
}
</style></head><body>
<div id="app"></div><nav id="nav"></nav><div id="sh" class="ov" hidden></div>
<script src="config.js"></script>
<script>
const $=s=>document.querySelector(s);
const E=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let FX=1.43,LERR="",CC=null,PC={t:"p"},FERR="";const EM=e=>e.name=="AbortError"?"The card feed took too long to answer.":e.message=="Failed to fetch"?"Couldn’t reach the card feed. Check your connection.":(e.message||"Something went wrong.");const CUR=new Intl.NumberFormat("en-US",{style:"currency",currency:"CAD"});const M=v=>CUR.format((+v||0)*FX);const upd=c=>S.ps.forEach(p=>{const it=p.items[c.id];if(it){it.p=c.p;it.img=c.img;it.imgL=c.imgL;it.num=c.num;it.live=1}});

/* Offline sample data. With the live feed reachable, every set and card loads instead. */
const SRC=[
["DR","Mega Evolution—Delta Reign","Nov 6, 2026","#2fbf71","#0b4f8a",141],
["30C","Pokémon TCG: 30th Celebration","Sep 16, 2026","#f2b01e","#c2401e"],
["PB","Mega Evolution—Pitch Black","Jul 17, 2026","#4b2f8f","#0a0a1f"],
["CR","Mega Evolution—Chaos Rising","2026","#d6366b","#37104a"],
["POR","Mega Evolution—Perfect Order","Mar 27, 2026","#2aa7c9","#1b2a78"],
["ASC","Mega Evolution—Ascended Heroes","Jan 30, 2026","#e8a33d","#7b2d5f"],
["PFL","Mega Evolution—Phantasmal Flames","Nov 14, 2025","#ff7a3d","#6b1e2e"],
["MEG","Mega Evolution","Sep 26, 2025","#7a5cff","#1d1a5c"],
["PRE","Prismatic Evolutions","Jan 17, 2025","#e56fb3","#4a2a8a"],
["SSP","Surging Sparks","Nov 8, 2024","#f5d020","#c24a12"],
["SCR","Stellar Crown","Sep 13, 2024","#3fb6a8","#1a3a6b"]
];
const OV={};SRC.forEach(([id,n,d,a,b,t])=>OV[id]={n,d,c:[a,b],t});
const hue=id=>{let h=0;for(const ch of id)h=(h*31+ch.charCodeAt(0))%360;return["hsl("+h+" 60% 42%)","hsl("+((h+40)%360)+" 55% 22%)"]};
const MAIN=`Base Sets|1999–2000|BS Base Set,JU Jungle,FO Fossil,B2 Base Set 2,RO Team Rocket
Gym Series|2000|G1 Gym Heroes,G2 Gym Challenge
Neo Series|2000–2002|N1 Neo Genesis,N2 Neo Discovery,SI Southern Islands,N3 Neo Revelation,N4 Neo Destiny
Legendary Collection|2002|LC Legendary Collection
E-Card Series|2002–2003|EX Expedition Base Set,AQ Aquapolis,SK Skyridge
EX Series|2003–2007|RS EX Ruby & Sapphire,SS EX Sandstorm,EXD EX Dragon,MA EX Team Magma vs Team Aqua,HL EX Hidden Legends,RG EX FireRed & LeafGreen,TR EX Team Rocket Returns,DX EX Deoxys,EM EX Emerald,UF EX Unseen Forces,DS EX Delta Species,LM EX Legend Maker,HP EX Holon Phantoms,CG EX Crystal Guardians,DF EX Dragon Frontiers,PK EX Power Keepers
POP Series|2004–2009|POP1 POP Series 1,POP2 POP Series 2,POP3 POP Series 3,POP4 POP Series 4,POP5 POP Series 5,POP6 POP Series 6,POP7 POP Series 7,POP8 POP Series 8,POP9 POP Series 9
Diamond & Pearl Series|2007–2008|DP Diamond & Pearl,MT Mysterious Treasures,SW Secret Wonders,GE Great Encounters,MD Majestic Dawn,LA Legends Awakened,SF Stormfront
Platinum Series|2009|PL Platinum,RR Rising Rivals,SV Supreme Victors,AR Arceus,RM Pokémon Rumble
HeartGold & SoulSilver Series|2010|HS HeartGold & SoulSilver,UL Unleashed,UND Undaunted,TRI Triumphant
Call of Legends|2011|COL Call of Legends
Black & White Series|2011–2013|BLW Black & White,EP Emerging Powers,NVI Noble Victories,NXD Next Destinies,DEX Dark Explorers,DRX Dragons Exalted,DRV Dragon Vault,BCR Boundaries Crossed,PLS Plasma Storm,PLF Plasma Freeze,PLB Plasma Blast,LTR Legendary Treasures
XY Series|2013–2016|KSS Kalos Starter Set,XY XY,FLF Flashfire,FFI Furious Fists,PHF Phantom Forces,PRC Primal Clash,DCR Double Crisis,ROS Roaring Skies,AOR Ancient Origins,BKT BREAKthrough,BKP BREAKpoint,GEN Generations,FCO Fates Collide,STS Steam Siege,EVO Evolutions
Sun & Moon Series|2017–2019|SUM Sun & Moon,GRI Guardians Rising,BUS Burning Shadows,SLG Shining Legends,CIN Crimson Invasion,UPR Ultra Prism,FLI Forbidden Light,CES Celestial Storm,DRM Dragon Majesty,LOT Lost Thunder,TEU Team Up,DET Detective Pikachu,UNB Unbroken Bonds,UNM Unified Minds,HIF Hidden Fates,CEC Cosmic Eclipse
Sword & Shield Series|2020–2023|SSH Sword & Shield,RCL Rebel Clash,DAA Darkness Ablaze,CPA Champion’s Path,VIV Vivid Voltage,SHF Shining Fates,BST Battle Styles,CRE Chilling Reign,EVS Evolving Skies,CEL Celebrations,FST Fusion Strike,BRS Brilliant Stars,ASR Astral Radiance,PGO Pokémon GO,LOR Lost Origin,SIT Silver Tempest,CRZ Crown Zenith
Scarlet & Violet Series|2023–2025|SVI Scarlet & Violet,PAL Paldea Evolved,OBF Obsidian Flames,MEW 151,PAR Paradox Rift,PAF Paldean Fates,TEF Temporal Forces,TWM Twilight Masquerade,SFA Shrouded Fable,SCR Stellar Crown,SSP Surging Sparks,PRE Prismatic Evolutions,JTG Journey Together,DRI Destined Rivals,BLK Black Bolt,WHT White Flare
Mega Evolution Series|2025–2026|MEG Mega Evolution,PFL Phantasmal Flames,ASC Ascended Heroes,POR Perfect Order,CR Chaos Rising,PB Pitch Black,30C 30th Celebration,DR Delta Reign`;
const EXTRA=`Black Star Promos||WBSP Wizards Black Star Promos [1999–2003],NBSP Nintendo Black Star Promos [2003–2006],DPBSP DP Black Star Promos [2007–2009],HGSSP HGSS Black Star Promos [2010–2011],BWP BW Black Star Promos [2011–2013],XYP XY Black Star Promos [2013–2017],SMP SM Black Star Promos [2016–2021],SWSHP SWSH Black Star Promos [2019–2023],SVP SVP Black Star Promos [2023–Present],MEP MEP Black Star Promos [2025–Present]
McDonald’s Collections||MCD11 McDonald’s Collection 2011,MCD12 McDonald’s Collection 2012,MCD13 McDonald’s Collection 2013,MCD14 McDonald’s Collection 2014,MCD15 McDonald’s Collection 2015,MCD16 McDonald’s Collection 2016,MCD17 McDonald’s Collection 2017,MCD18 McDonald’s Collection 2018,MCD19 McDonald’s Collection 2019,MCD21 McDonald’s Collection 2021,MCD22 McDonald’s Collection 2022,MCD23 McDonald’s Collection 2023,MCD24 McDonald’s Collection 2024,MCD26 McDonald’s Collection 2026
Play! Pokémon Prize Packs||PPS1 Prize Pack Series 1,PPS2 Prize Pack Series 2,PPS3 Prize Pack Series 3,PPS4 Prize Pack Series 4,PPS5 Prize Pack Series 5,PPS6 Prize Pack Series 6,PPS7 Prize Pack Series 7,PPS8 Prize Pack Series 8,PPS9 Prize Pack Series 9
Trick or Trade||TOT22 Trick or Trade 2022,TOT23 Trick or Trade 2023,TOT24 Trick or Trade 2024`;
const mkSets=(txt,rev)=>{const a=txt.trim().split("\n").map(l=>{const[n,y,x]=l.split("|");return{n,y,l:x.split(",")}});if(rev){a.reverse();a.forEach(e=>e.l.reverse())}
return a.flatMap(e=>e.l.map(t=>{const i=t.indexOf(" "),id=t.slice(0,i),o=OV[id]||{};let nm=t.slice(i+1),dt=e.y;const m=/^(.*) \[(.+)\]$/.exec(nm);if(m){nm=m[1];dt=m[2]}return{id,n:o.n||nm,d:o.d||dt,c:o.c||hue(id),t:o.t,e:e.n}}))};
let SETS=[...mkSets(MAIN,1),...mkSets(EXTRA,0)];
const CARDS={
DR:[["Mega Rayquaza ex","Mega Hyper Rare",285],["Mega Golurk ex","Double Rare",3.5],["Mega Malamar ex","Double Rare",3],["Mega Golisopod ex","Double Rare",2.8],["Sprigatito","Illustration Rare",14],["Pincurchin","Illustration Rare",9]],
POR:[["Mega Zygarde ex","Double Rare",6],["Mega Clefable ex","Double Rare",4.5],["Mega Starmie ex","Double Rare",4],["Mega Skarmory ex","Double Rare",3],["Meowth ex","Double Rare",2.5]],
ASC:[["Mega Emboar ex","Double Rare",5],["Mega Feraligatr ex","Double Rare",5.5],["Mega Meganium ex","Double Rare",5]],
PB:[["Mega Darkrai ex","Double Rare",8]],
PFL:[["Mega Charizard X ex","Double Rare",22]],
MEG:[["Mega Lucario ex","Double Rare",9],["Mega Gardevoir ex","Double Rare",8]],
PRE:[["Umbreon ex","Special Illustration Rare",900],["Sylveon ex","Special Illustration Rare",320]],
SSP:[["Pikachu ex","Special Illustration Rare",420]],
SCR:[["Terapagos ex","Ultra Rare",18]]
};
const cardsOf=sid=>(CARDS[sid]||[]).map((c,i)=>({id:sid+"-"+i,sid,n:c[0],num:String(i+1),r:c[1],p:c[2]}));

/* Price history (saved daily on the server) */
const RGS=[["1d","1D",864e5],["7d","7D",6048e5],["1m","1M",2592e6],["3m","3M",7776e6],["6m","6M",15552e6],["12m","12M",31536e6],["all","All",0]];
const HI={};
async function hist(g){if(HI[g]===undefined){try{HI[g]=await jget("data/h/"+g+".json")}catch(e){HI[g]=null}}return HI[g]}
const win=(a,dur,n)=>{if(!dur)return a.length>1?a:[];const s=n-dur,p=a.filter(q=>q[0]>=s),b=a.filter(q=>q[0]<s).pop();if(b)p.unshift([s,b[1]]);return p.length>1?p:[]};
const hp=(g,id)=>{const h=HI[g];if(!h||!h.p[id])return[];const o=[];h.d.forEach((d,i)=>{const v=h.p[id][i];if(v!=null)o.push([Date.parse(d+"T20:00:00Z"),v])});return o};
function seriesFor(dur,cx){const n=Date.now();
if(cx.t=="c")return win(hp(cx.c.sid,cx.c.id),dur,n);
const its=Object.entries(P().items).map(([id,x])=>({id,...x}));if(!its.length)return[];
const H=its.map(x=>{const a=hp(x.sid,x.id);return a.length?a:[[n,x.p]]});
const s=dur?n-dur:Math.min(...H.map(a=>a[0][0]));if(n-s<6e4)return[];
const pts=[];for(let i=0;i<=48;i++){const t=s+(n-s)*i/48;let v=0;its.forEach((x,j)=>{let pr=H[j][0][1];for(const q of H[j]){if(q[0]<=t)pr=q[1];else break}v+=x.q*pr});pts.push([t,v])}return pts}
const gsOf=cx=>!cx?[]:cx.t=="c"?[cx.c.sid]:[...new Set(Object.values(P().items).map(x=>x.sid))];
async function drawCh(cx,sel){if(!LIVE||!cx)return;await Promise.all(gsOf(cx).map(hist));const c=$(sel);if(c)c.innerHTML=chartHTML(cx)}
function line(pts){const W=320,Hh=120,v=pts.map(p=>p[1]),lo=Math.min(...v),hi=Math.max(...v),t0=pts[0][0],t1=pts[pts.length-1][0],sp=hi-lo||1;
const X=t=>(t-t0)/((t1-t0)||1)*W,Y=y=>Hh-8-(y-lo)/sp*(Hh-16);
const d=pts.map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)).join("");const col=v[v.length-1]>=v[0]?"var(--up)":"#e5484d";
return '<svg viewBox="0 0 '+W+" "+Hh+'" width="100%" role="img" aria-label="Price chart"><path d="'+d+"L"+W+" "+Hh+"L0 "+Hh+'Z" fill="'+col+'" opacity=".12"/><path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round"/></svg>'}
function chartHTML(cx){const cur=S.rg||"1m",dur=(RGS.find(r=>r[0]==cur)||RGS[2])[2],pf=cx&&cx.t=="p";
const chips=(pf?'<b>Portfolio value</b>':"")+'<div class="chips">'+RGS.map(r=>'<button class="chip '+(r[0]==cur?"on":"")+'" data-rg="'+r[0]+'">'+r[1]+"</button>").join("")+"</div>";
if(!LIVE)return chips+'<p class="mu">Price history needs live prices. It works once the app is hosted online.</p>';
if(gsOf(cx).some(g=>HI[g]===undefined))return chips+'<p class="mu">Loading price history…</p>';
const pts=cx?seriesFor(dur,cx):[];
if(pts.length<2)return chips+'<p class="mu">Not enough history in this range yet. A new price is saved once a day.</p>';
const a=pts[0][1],b=pts[pts.length-1][1],pc=a?(b-a)/a*100:0,v=pts.map(p=>p[1]);
return chips+line(pts)+'<div class="bn" style="display:flex;justify-content:space-between"><span>'+(pc>=0?"+":"")+pc.toFixed(1)+"% in range</span><span>"+M(Math.min(...v))+" – "+M(Math.max(...v))+'</span></div><div class="bn">'+(pf?"Value of this portfolio’s cards, from daily TCGplayer prices.":"Daily TCGplayer market prices.")+"</div>"}

/* State */
let S={ps:[{id:1,name:"My Collection",items:{}}],a:1,tab:"p"},SS=null,LIVE=false,SQ=1,LC={},R={};
try{const j=localStorage.getItem("ct1");if(j)S=JSON.parse(j)}catch(e){}
const save=()=>{try{localStorage.setItem("ct1",JSON.stringify(S))}catch(e){}push()};
const P=()=>S.ps.find(p=>p.id==S.a)||S.ps[0];
const setOf=id=>SETS.find(s=>s.id==id)||{n:"",d:"",c:["#6c4cff","#2a1a6e"]};
const reg=c=>(R[c.id]=c);

/* Live data: files on this site, built daily from TCGplayer prices by sync.py */
const jget=async p=>{const r=await fetch(p,{cache:"no-cache"});if(!r.ok)throw new Error("Couldn’t load "+p+" (error "+r.status+"). Has the daily sync run yet?");return r.json()};
const IMG=(id,big)=>"https://tcgplayer-cdn.tcgplayer.com/product/"+id+(big?"_in_1000x1000.jpg":"_200w.jpg");
const cd=(c,g)=>({id:String(c[0]),sid:String(g),n:c[1],num:c[2],r:c[3],p:c[4]||0,img:IMG(c[0]),imgL:IMG(c[0],1),live:1,sl:c[2]?0:1});
async function getCards(sid){if(!LIVE)return cardsOf(sid);if(!LC[sid]){try{LC[sid]=(await jget("data/s/"+sid+".json")).c.map(c=>cd(c,sid));LC[sid].forEach(upd)}catch(e){LERR=EM(e);return[]}}LERR="";return LC[sid]}
let IDX=null;
async function findCards(q){if(!IDX)IDX=await jget("data/idx.json");const t=q.split(/\s+/).filter(Boolean),f=t[0],o=[];
for(const r of IDX){const nm=r[2].toLowerCase();if(t.every(w=>nm.includes(w)))o.push(r)}
o.sort((a,b)=>(+b[2].toLowerCase().startsWith(f)-+a[2].toLowerCase().startsWith(f))||(b[5]||0)-(a[5]||0));
return o.slice(0,60).map(r=>cd([r[0],r[2],r[3],r[4],r[5]],r[1]))}
async function init(){try{const d=await jget("data/sets.json");const MISC=/latias|latios|plusle|minun|nintendo promo|^pop series \d|alternate art promo|alt\.? art promo|blister exclusive|burger king|first partner pack|miscellaneous|misc\./i;SETS=d.map(s=>({id:String(s.g),n:s.n,d:s.d,logo:s.l,c:hue(String(s.g)),t:s.t,e:MISC.test(s.n)?"Misc.":s.d.slice(0,4)}));SETS=[...SETS.filter(s=>s.e!="Misc."),...SETS.filter(s=>s.e=="Misc.").sort((a,b)=>a.n.localeCompare(b.n))];LIVE=true;render()}catch(e){FERR=EM(e);render();return}
try{for(const g of new Set(S.ps.flatMap(p=>Object.values(p.items).map(x=>x.sid))))await getCards(g);save();render()}catch(e){}
try{const r=await fetch("https://open.er-api.com/v6/latest/USD");FX=(await r.json()).rates.CAD||FX;render()}catch(e){}}

/* Pieces */
const bn=()=>'<div class="bn">'+(LIVE?"TCGplayer market prices in CAD, updated daily":(FERR?"Live feed unavailable: "+FERR+" Showing sample data.":"Sample cards and demo prices in CAD. Live prices and card images load when the page is hosted online."))+" · USD→CAD "+FX.toFixed(2)+"</div>";
function logo(s){const p=s.n.split("—"),a=p.length>1?p[0]:"",b=p.length>1?p[1]:s.n;return '<div class="lg'+(s.logo?" has":"")+'" style="background:linear-gradient(150deg,'+s.c[0]+","+s.c[1]+')">'+(s.logo?'<img src="'+E(s.logo)+'" alt="" onerror="this.parentNode.classList.remove(\'has\');this.remove()">':"")+"<small>"+E(a)+"</small><strong>"+E(b)+"</strong></div>"}
function thumb(c,cls){const s=setOf(c.sid);return '<div class="th '+(cls||"")+'" style="background:linear-gradient(150deg,'+s.c[0]+","+s.c[1]+')">'+(c.img?'<img src="'+E(cls=="big"&&c.imgL||c.img)+'" alt="" onerror="this.remove()">':"✦")+"</div>"}
function row(c,right){reg(c);return '<div class="card row" data-c="'+E(c.id)+'">'+thumb(c)+'<div class="mid"><b>'+E(c.n)+"</b><span>"+(c.live&&c.num?"#"+E(c.num)+" · ":"")+E(setOf(c.sid).n)+(c.r?" · "+E(c.r):"")+"</span></div>"+right+"</div>"}
function tabs(){$("#nav").innerHTML=[["p","💼","Portfolio"],["s","📚","Sets"],["q","🔍","Search"],["a","👤","Account"]].map(([k,i,l])=>'<button data-t="'+k+'" class="'+(S.tab==k?"on":"")+'"><i>'+i+"</i>"+l+"</button>").join("")}

function vP(){const p=P(),its=Object.entries(p.items).map(([id,x])=>({id,...x}));
const tot=its.reduce((t,x)=>t+x.q*x.p,0),n=its.reduce((t,x)=>t+x.q,0);
return "<h1>Portfolio</h1>"+bn()+'<div class="chips">'+S.ps.map(q=>'<button class="chip '+(q.id==p.id?"on":"")+'" data-p="'+q.id+'">'+E(q.name)+"</button>").join("")+'<button class="chip" data-np>＋ New</button></div>'+
'<div class="top"><div class="tot"><small>Total value</small><b>'+M(tot)+"</b><small>"+n+" cards · "+its.length+" unique</small></div>"+(its.length?'<div class="card cp" id="chp" data-cx="p">'+chartHTML(PC)+"</div>":"")+"</div>"+
(its.length?'<div class="list">'+its.map(x=>row(x,'<div class="rt"><div class="pr">'+M(x.q*x.p)+'</div><div class="qt"><button data-q="'+E(x.id)+':-1">−</button>'+x.q+'<button data-q="'+E(x.id)+':1">＋</button></div></div>')).join("")+"</div>":'<p class="mu">This portfolio is empty. Search for a card or open a set to add your first one.</p><button class="bt" data-t="q">Search cards</button>')+
(S.ps.length>1?'<button class="lk" data-del>Delete this portfolio</button>':"")}

const own=sid=>Object.values(P().items).filter(x=>x.sid==sid&&!x.sl).length;
const prog=s=>{const n=own(s.id);return s.t?n+"/"+s.t+" · "+Math.floor(n/s.t*100)+"%":(n?n+" owned":"")};
function vSets(){let last,h="";for(const s of SETS){if(s.e!==last){h+=(last!==undefined?"</div>":"")+"<h2>"+E(s.e)+'</h2><div class="grid">';last=s.e}h+='<button class="sb" data-s="'+E(s.id)+'">'+logo(s)+"<em>"+E(s.d)+(prog(s)?(s.d?" · ":"")+prog(s):"")+"</em></button>"}return "<h1>Sets</h1>"+bn()+h+"</div>"}
const sl=c=>c.sl?1:0;const num=c=>{const m=String(c.num||"").match(/\d+/);return m?+m[0]:0};
const SORTS={pa:(a,b)=>a.p-b.p,pd:(a,b)=>b.p-a.p,na:(a,b)=>sl(a)-sl(b)||num(a)-num(b)||String(a.num).localeCompare(String(b.num)),nd:(a,b)=>sl(a)-sl(b)||num(b)-num(a)||String(b.num).localeCompare(String(a.num)),az:(a,b)=>a.n.localeCompare(b.n)};
const SN={pa:"Price Low - High",pd:"Price High - Low",na:"Card NO Low - High",nd:"Card NO High - Low",az:"Card Name A - Z"};
function addC(c,n,p,ns){p=p||P();const it=p.items[c.id]||(p.items[c.id]={q:0});Object.assign(it,{n:c.n,sid:c.sid,r:c.r,p:c.p,img:c.img,imgL:c.imgL,num:c.num,live:c.live,sl:c.sl});it.q+=n;if(it.q<=0)delete p.items[c.id];if(!ns)save()}
const rt=c=>{const it=P().items[c.id],q=it?it.q:0;return '<div class="rt"><div class="pr">'+M(c.p)+'</div><div class="qt">'+(q?'<button data-q="'+E(c.id)+':-1">−</button>'+q:"")+'<button data-ad="'+E(c.id)+'">＋</button></div></div>'};
async function allDlg(){const cs=(await getCards(SS)).filter(c=>!c.sl),p=P(),miss=cs.filter(c=>!p.items[c.id]).length;
sheet('<h2>Add all cards</h2><p class="mu">'+(miss?"Adds 1 of each of the "+miss+" cards you don’t have yet from “"+E(setOf(SS).n)+"”. Sealed products are not included.":"You already have every card from this set.")+'</p>'+(miss?'<select id="ps2">'+S.ps.map(q=>'<option value="'+q.id+'"'+(q.id==S.a?" selected":"")+">"+E(q.name)+"</option>").join("")+'</select><button class="bt" data-ally>Add '+miss+' cards</button>':"")+'<button class="bt g" data-x>'+(miss?"Cancel":"Close")+"</button>")}
async function allGo(){const cs=(await getCards(SS)).filter(c=>!c.sl),p=S.ps.find(q=>q.id==$("#ps2").value)||P();cs.forEach(c=>{if(!p.items[c.id])addC(c,1,p,1)});S.a=p.id;save();closeS();render()}
function vSet(s,cs){const n=own(s.id),t=s.t||0,pc=t?Math.floor(n/t*100):0,so=S.sort||"na",fl=S.fl||"all";
const shown=cs.filter(c=>fl=="all"||(fl=="c")==!c.sl);
return '<button class="lk" data-back>‹ All sets</button>'+logo(s)+"<h1>"+E(s.n)+"</h1>"+bn()+'<div class="card cp"><b>'+(t?pc+"% complete":n+" cards owned")+'</b><span class="mu">'+(t?n+" of "+t+" cards in this portfolio":"Total card count loads with live data")+'</span><div class="pg"><i style="width:'+pc+'%"></i></div></div>'+
(cs.length?(cs.some(c=>!c.sl)?'<button class="bt" data-all>Add all cards from this set</button>':"")+'<div class="chips" style="margin-top:12px">'+[["all","All"],["c","Cards"],["s","Sealed"]].map(f=>'<button class="chip '+(f[0]==fl?"on":"")+'" data-fl="'+f[0]+'">'+f[1]+"</button>").join("")+'</div><select id="so">'+Object.keys(SN).map(k=>'<option value="'+k+'"'+(k==so?" selected":"")+">"+SN[k]+"</option>").join("")+'</select><div class="list">'+[...shown].sort(SORTS[so]).map(c=>row(c,rt(c))).join("")+"</div>":(LIVE?'<p class="mu">'+E(LERR||"There are no cards or products for this set yet. New sets can take a few days to appear.")+"</p>"+(LERR?'<button class="bt" data-rt>Try again</button>':""):'<p class="mu">This set’s card list isn’t in the offline sample. It loads when the page is hosted online.</p>'))}
function vQ(){return "<h1>Search</h1>"+bn()+'<input id="qi" type="search" placeholder="Search any card or set" autocomplete="off"><div id="res"><p class="mu">Type a card name to see prices.</p></div>'}

async function render(){tabs();const a=$("#app");
if(S.tab=="p"){a.innerHTML=vP();drawCh(PC,"#chp")}
else if(S.tab=="s"){if(SS){if(!LC[SS])a.innerHTML='<p class="mu">Loading…</p>';const cs=await getCards(SS);a.innerHTML=vSet(setOf(SS),cs)}else a.innerHTML=vSets()}
else if(S.tab=="a")a.innerHTML=vA();
else{a.innerHTML=vQ();$("#qi").oninput=e=>search(e.target.value)}}

let tm;function search(q){q=q.trim().toLowerCase();const r=$("#res");clearTimeout(tm);
if(!q){r.innerHTML='<p class="mu">Type a card name to see prices.</p>';return}
const show=cs=>{r.innerHTML=cs.length?'<div class="list">'+cs.map(c=>row(c,'<div class="pr">'+M(c.p)+"</div>")).join("")+"</div>":'<p class="mu">No cards match “'+E(q)+"”.</p>"};
if(LIVE)tm=setTimeout(async()=>{try{show(await findCards(q))}catch(e){r.innerHTML='<p class="mu">'+E(EM(e))+"</p>"}},250);
else show(SETS.flatMap(s=>cardsOf(s.id)).filter(c=>c.n.toLowerCase().includes(q)||setOf(c.sid).n.toLowerCase().includes(q)))}

/* Sheets */
function sheet(h){const o=$("#sh");o.innerHTML='<div class="sheet">'+h+"</div>";o.hidden=false}
const closeS=()=>{$("#sh").hidden=true};
function vC(c){SQ=1;CC={t:"c",c};sheet(thumb(c,"big")+"<h2>"+E(c.n)+"</h2><p class=\"mu\">"+E(setOf(c.sid).n)+(c.r?" · "+E(c.r):"")+'</p><div class="pr">'+M(c.p)+'</div><div id="chc" data-cx="c">'+chartHTML(CC)+'</div><div class="sq"><button data-sq="-1">−</button><b id="sqn">1</b><button data-sq="1">＋</button></div><select id="ps">'+S.ps.map(p=>'<option value="'+p.id+'"'+(p.id==S.a?" selected":"")+">"+E(p.name)+"</option>").join("")+'</select><button class="bt" data-add="'+E(c.id)+'">Add to portfolio</button><button class="bt g" data-x>Close</button>');drawCh(CC,"#chc")}
function vNew(){sheet('<h2>New portfolio</h2><p class="mu">Make as many as you like.</p><input id="pn" placeholder="Portfolio name" value="Portfolio '+(S.ps.length+1)+'"><button class="bt" data-mk>Create portfolio</button><button class="bt g" data-x>Cancel</button>')}

document.addEventListener("click",e=>{const t=e.target.closest("[data-t],[data-p],[data-np],[data-s],[data-q],[data-c],[data-add],[data-x],[data-back],[data-del],[data-dy],[data-mk],[data-sq],[data-au],[data-go],[data-out],[data-fp],[data-rt],[data-rg],[data-ad],[data-all],[data-ally],[data-fl]");if(!t)return;const d=t.dataset;
if("au"in d){AM=AM=="in"?"up":"in";AE="";render()}
else if("go"in d)authGo();
else if("fp"in d)resetPw();
else if("rt"in d)render();
else if("rg"in d){S.rg=d.rg;const b=t.closest("[data-cx]");if(b)b.innerHTML=chartHTML(b.dataset.cx=="p"?PC:CC)}
else if("ad"in d){const c=R[d.ad];if(c){addC(c,1);render()}}
else if("fl"in d){S.fl=d.fl;render()}
else if("all"in d)allDlg();
else if("ally"in d)allGo();
else if("out"in d)signOut();
else if("t"in d){S.tab=d.t;SS=null;closeS();render()}
else if("p"in d){S.a=+d.p;save();render()}
else if("np"in d)vNew();
else if("mk"in d){const n=($("#pn").value||"").trim()||"Portfolio "+(S.ps.length+1),id=Date.now();S.ps.push({id,name:n,items:{}});S.a=id;S.tab="p";save();closeS();render()}
else if("s"in d){SS=d.s;scrollTo(0,0);render()}
else if("back"in d){SS=null;render()}
else if("q"in d){const i=d.q.lastIndexOf(":"),id=d.q.slice(0,i),dq=+d.q.slice(i+1),it=P().items[id];if(it){it.q+=dq;if(it.q<=0)delete P().items[id];save();render()}}
else if("c"in d){const c=R[d.c];if(c)vC(c)}
else if("sq"in d){SQ=Math.max(1,SQ+ +d.sq);$("#sqn").textContent=SQ}
else if("add"in d){const c=R[d.add],p=S.ps.find(x=>x.id==$("#ps").value)||P();if(c){const it=p.items[c.id]||(p.items[c.id]={q:0});Object.assign(it,{n:c.n,sid:c.sid,r:c.r,p:c.p,img:c.img,imgL:c.imgL,num:c.num,live:c.live,sl:c.sl});it.q+=SQ;S.a=p.id;save()}closeS();if(S.tab=="p")render()}
else if("del"in d)sheet('<h2>Delete “'+E(P().name)+'”?</h2><p class="mu">Its cards are removed from your totals.</p><button class="bt" data-dy>Delete portfolio</button><button class="bt g" data-x>Keep it</button>');
else if("dy"in d){S.ps=S.ps.filter(p=>p.id!=S.a);S.a=S.ps[0].id;save();closeS();render()}
else if("x"in d&&(t.tagName=="BUTTON"||e.target==t))closeS()});

document.addEventListener("change",e=>{if(e.target.id=="so"){S.sort=e.target.value;save();render()}});
if(!S.ps||!S.ps.length)S={ps:[{id:1,name:"My Collection",items:{}}],a:1,tab:"p"};
/* Account + cloud sync (Firebase) */
const CFG=window.FB_CONFIG,OK=!!(CFG&&CFG.apiKey&&!/PASTE/.test(CFG.apiKey));
let FA=null,FD=null,FU=null,AM="in",AE="",AX="",AOK=0,ST="",unsub=null,pt=null;
const AER={"auth/invalid-credential":"Wrong email or password.","auth/invalid-email":"That email doesn’t look right.","auth/email-already-in-use":"That email already has an account.","auth/weak-password":"Password needs at least 6 characters.","auth/too-many-requests":"Too many tries. Wait a minute and try again.","auth/network-request-failed":"No connection. Check your internet."};
const pay=()=>JSON.stringify({ps:S.ps,a:S.a,sort:S.sort});
const ld=u=>new Promise((r,j)=>{const s=document.createElement("script");s.src=u;s.onload=r;s.onerror=j;document.head.append(s)});
const redo=()=>{if(S.tab=="a")render()};
function push(){if(!FU||!FD)return;clearTimeout(pt);pt=setTimeout(()=>{FD.doc("users/"+FU.uid).set({data:pay(),updated:Date.now()},{merge:true}).then(()=>{ST="Synced "+new Date().toLocaleTimeString();redo()}).catch(e=>{ST="Sync error: "+e.code;redo()})},800)}
function listen(){let first=true;unsub=FD.doc("users/"+FU.uid).onSnapshot(s=>{if(s.metadata.hasPendingWrites)return;const d=s.exists?s.data().data:null;
if(d&&d!==pay()){try{const c=JSON.parse(d);if(first)try{localStorage.setItem("ct1_backup",JSON.stringify(S))}catch(e){}S.ps=c.ps;S.a=c.a;S.sort=c.sort;try{localStorage.setItem("ct1",JSON.stringify(S))}catch(e){}render()}catch(e){}}
else if(!d&&first)push();
first=false;ST="Synced "+new Date().toLocaleTimeString();redo()},e=>{ST="Sync error: "+e.code;redo()})}
async function fbInit(){if("serviceWorker"in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{});
if(!OK)return;try{const b="https://www.gstatic.com/firebasejs/10.12.2/firebase-";await ld(b+"app-compat.js");await Promise.all([ld(b+"auth-compat.js"),ld(b+"firestore-compat.js")]);firebase.initializeApp(CFG);FA=firebase.auth();FD=firebase.firestore();
FA.onAuthStateChanged(u=>{FU=u;if(unsub){unsub();unsub=null}if(u)listen();else ST="";redo()})}catch(e){AE="Couldn’t reach the sync service. Check your connection.";redo()}}
async function authGo(){const g=i=>$("#"+i)?$("#"+i).value.trim():"";const em=g("ae"),us=g("au"),pw=$("#ap").value;AE="";AOK=0;AX=em;
if(!FA){AE="Sync is still loading. Try again in a moment.";return render()}
try{if(AM=="up"){if(!/^[A-Za-z0-9_]{3,20}$/.test(us))throw{message:"Username must be 3 to 20 letters, numbers or underscores."};
const c=await FA.createUserWithEmailAndPassword(em,pw);
try{await FD.doc("usernames/"+us.toLowerCase()).set({uid:c.user.uid})}catch(e){await c.user.delete();throw{message:"That username is taken. Pick another."}}
await c.user.updateProfile({displayName:us});await FD.doc("users/"+c.user.uid).set({username:us,email:em},{merge:true})}
else await FA.signInWithEmailAndPassword(em,pw)}catch(e){AE=AER[e.code]||e.message||"Something went wrong."}
render()}
function resetPw(){const em=$("#ae").value.trim();AX=em;AOK=0;if(!em){AE="Enter your email first.";return render()}
FA.sendPasswordResetEmail(em).then(()=>{AE="Reset link sent. Check your email.";AOK=1}).catch(e=>{AE=AER[e.code]||"Couldn’t send the reset email."}).finally(render)}
function signOut(){FA.signOut().then(()=>{S={ps:[{id:1,name:"My Collection",items:{}}],a:1,tab:"a"};try{localStorage.setItem("ct1",JSON.stringify(S))}catch(e){}render()})}
function vA(){
if(!OK)return '<h1>Account</h1><p class="mu">Cloud sync isn’t switched on in this copy yet. Follow Part 2 and Part 3 of the tutorial to turn it on.</p>';
if(FU)return '<h1>Account</h1><div class="card cp"><b>'+E(FU.displayName||"Signed in")+'</b><span class="mu">'+E(FU.email)+'</span><p class="mu">'+E(ST||"Syncing…")+'</p></div><p class="mu">Your portfolios sync to every device signed in to this account. Signing out removes this device’s local copy; your cards stay in your account.</p><button class="bt g" data-out>Sign out</button>';
const up=AM=="up";
return "<h1>"+(up?"Create account":"Sign in")+"</h1>"+(AE?'<p style="color:'+(AOK?"var(--up)":"#e5484d")+'">'+E(AE)+"</p>":"")+'<input id="ae" type="email" placeholder="Email" autocomplete="email" value="'+E(AX)+'">'+(up?'<input id="au" placeholder="Username" autocomplete="username" autocapitalize="none">':"")+'<input id="ap" type="password" placeholder="Password" autocomplete="'+(up?"new":"current")+'-password"><button class="bt" data-go>'+(up?"Create account":"Sign in")+"</button>"+(up?"":'<button class="lk" data-fp>Forgot password?</button><br>')+'<button class="lk" data-au>'+(up?"Have an account? Sign in":"New here? Create an account")+"</button>"}
document.addEventListener("keydown",e=>{if(e.key=="Enter"&&e.target.id=="ap")authGo()});
render();init();fbInit();
</script></body></html>
